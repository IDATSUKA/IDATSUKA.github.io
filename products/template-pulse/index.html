<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
  PULSE — Dynamic Landing Page Template v1.1 (Luxury)
  by IDATSUKA (https://idatsuka.com)

  ZEN（静）／RAY（光）の次の棚：動き。v1.1 はスペクタクル寄り。
  テキスト最小・映像とガラスとキネティックが主役の1枚LP。

  ■ カスタマイズ
  1. <title> / meta description を変更
  2. :root の CSS 変数（プラチナ／ゴールド／シアン／マゼンタ）を調整
  3. EDIT: ブロックのコピー・リンクを差し替え（文言は短く）
  4. media/ の動画・ポスターを差し替え（下記コメント参照）
  5. 単一 HTML — ビルド不要。アップロードして公開

  ■ ヒーロー動画の差し替え手順
  1. media/hero-loop.webm と media/hero-loop.mp4 を同尺・同構図で用意
  2. media/hero-poster.jpg を先頭フレーム相当の静止画に差し替え
  3. パスはそのまま（相対パス media/...）でOK
  4. prefers-reduced-motion: reduce では JS が video を停止し poster のみ表示

  ■ テーマ
  ダーク / ライトはテーマボタン、または <html data-theme="light">

  License: 個人・商用利用可 / テンプレとしての再販不可
============================================================ -->

<title>PULSE — Luxury Motion Landing</title>
<meta name="description" content="映像とキネティックが主役のラグジュアリー動的LP。ビルド不要・1ファイル。テキスト最小。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">

<style>
/* ============================================================
   THEME — ほぼ黒 + プラチナ／ソフトゴールド + 洗練シアン／マゼンタ
   （ファッション／テックショールーム。ネオンゲーマーではない）
============================================================ */
:root, [data-theme="dark"] {
  --bg: #050507;
  --bg2: #0c0c10;
  --fg: #f4f1ea;
  --fg-dim: #a8a29a;
  --muted: #6b6560;
  --platinum: #e8e4dc;   /* EDIT: ハイライトメタル */
  --gold: #c9a962;       /* EDIT: ソフトゴールド */
  --cyan: #7dd3e8;       /* EDIT: 洗練シアン（彩度控えめ） */
  --magenta: #d4a5c0;    /* EDIT: ローズ／マゼンタ寄り */
  --accent: var(--gold);
  --accent2: var(--cyan);
  --accent-soft: color-mix(in srgb, var(--gold) 22%, transparent);
  --accent2-soft: color-mix(in srgb, var(--cyan) 16%, transparent);
  --glass: color-mix(in srgb, #12141a 55%, transparent);
  --glass-border: color-mix(in srgb, var(--platinum) 18%, transparent);
  --border: #1a1816;
  --serif: 'Cormorant Garamond', 'Times New Roman', serif;
  --sans: 'Inter', 'Zen Kaku Gothic New', sans-serif;
  --mono: 'Space Mono', monospace;
  --maxw: 1100px;
  --glow:
    radial-gradient(ellipse 60% 45% at 50% 35%, var(--accent-soft), transparent 60%),
    radial-gradient(ellipse 40% 35% at 78% 18%, var(--accent2-soft), transparent 55%),
    radial-gradient(ellipse 35% 30% at 18% 70%, color-mix(in srgb, var(--magenta) 12%, transparent), transparent 50%);
}

[data-theme="light"] {
  --bg: #f3efe8;
  --bg2: #fffcf7;
  --fg: #161412;
  --fg-dim: #5c564e;
  --muted: #8a8378;
  --platinum: #3a3630;
  --gold: #9a7b3a;
  --cyan: #3d8fa3;
  --magenta: #9a6b82;
  --accent: var(--gold);
  --accent2: var(--cyan);
  --accent-soft: color-mix(in srgb, var(--gold) 16%, transparent);
  --accent2-soft: color-mix(in srgb, var(--cyan) 12%, transparent);
  --glass: color-mix(in srgb, #ffffff 72%, transparent);
  --glass-border: color-mix(in srgb, #000 10%, transparent);
  --border: #e4ddd2;
  --glow:
    radial-gradient(ellipse 60% 45% at 50% 35%, var(--accent-soft), transparent 60%),
    radial-gradient(ellipse 40% 35% at 78% 18%, var(--accent2-soft), transparent 55%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-weight: 300;
  line-height: 1.7; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img, video { max-width: 100%; display: block; }
button { font: inherit; }

/* ---- Cursor glow (subtle) ---- */
.cursor-glow {
  pointer-events: none; position: fixed; z-index: 5;
  width: 42vw; height: 42vw; max-width: 520px; max-height: 520px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 68%);
  transform: translate(-50%, -50%);
  opacity: .55; mix-blend-mode: screen;
  transition: opacity .4s;
}
[data-theme="light"] .cursor-glow { mix-blend-mode: multiply; opacity: .35; }
@media (hover: none) { .cursor-glow { display: none; } }

/* ---- Top chrome ---- */
.chrome {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.15rem 1.5rem;
  pointer-events: none;
}
.chrome > * { pointer-events: auto; }
.wordmark {
  font-family: var(--serif); font-size: 1.15rem; font-weight: 400;
  letter-spacing: .28em; text-transform: uppercase;
  color: var(--platinum);
}
.chrome-right { display: flex; align-items: center; gap: .75rem; }
.theme-btn {
  font-family: var(--mono); font-size: .55rem; letter-spacing: .14em;
  border: 1px solid var(--glass-border); background: var(--glass);
  color: var(--fg-dim); padding: .5rem .7rem; cursor: pointer;
  border-radius: 999px; backdrop-filter: blur(14px);
  transition: border-color .25s, color .25s, background .25s;
}
.theme-btn:hover { color: var(--fg); border-color: var(--gold); }

/* シンボルナビ（ドット） */
.rail {
  position: fixed; right: 1.1rem; top: 50%; transform: translateY(-50%);
  z-index: 90; display: flex; flex-direction: column; gap: .65rem;
}
.rail a {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--platinum) 45%, transparent);
  background: transparent; display: block;
  transition: background .3s, transform .3s, border-color .3s;
}
.rail a:hover, .rail a.is-active {
  background: var(--gold); border-color: var(--gold);
  transform: scale(1.25);
}
.rail a span {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
}

/* ---- Stage / video canvas ---- */
.stage {
  position: relative; min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.stage-media {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
}
.stage-media video,
.stage-media .hero-poster-fallback {
  width: 100%; height: 100%; object-fit: cover;
  opacity: .55; filter: saturate(.92) contrast(1.08) brightness(.88);
  transform: scale(1.04);
  will-change: transform;
}
.stage-media::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 42%, transparent) 0%,
      color-mix(in srgb, var(--bg) 18%, transparent) 38%,
      color-mix(in srgb, var(--bg) 55%, transparent) 72%,
      var(--bg) 100%),
    var(--glow);
}
.stage-vignette {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 0 0 120px color-mix(in srgb, #000 55%, transparent);
}
[data-theme="light"] .stage-vignette {
  box-shadow: inset 0 0 100px color-mix(in srgb, var(--bg) 40%, transparent);
}

.stage-content {
  position: relative; z-index: 2;
  text-align: center; padding: 6rem 1.5rem 4rem;
  max-width: 42rem;
}

/* キネティック — 1語＋1行 */
.k-word {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(3.6rem, 14vw, 8.5rem);
  letter-spacing: .08em; line-height: .95;
  color: var(--fg);
  overflow: hidden; margin-bottom: 1.1rem;
}
.k-word .k-inner {
  display: inline-block;
  transform: translateY(110%);
  background: linear-gradient(105deg, var(--platinum) 0%, var(--gold) 45%, var(--cyan) 100%);
  background-size: 180% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: kRise 1.15s cubic-bezier(.16,1,.3,1) .1s forwards, shimmerX 8s ease-in-out 1.4s infinite;
}
@keyframes kRise { to { transform: translateY(0); } }
@keyframes shimmerX {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.k-line {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: clamp(1.05rem, 2.6vw, 1.45rem);
  letter-spacing: .04em; color: var(--fg-dim);
  opacity: 0; animation: fadeUp .9s ease .45s forwards;
  margin-bottom: 2.4rem;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

.cta {
  display: inline-flex; align-items: center; gap: .65rem;
  font-family: var(--mono); font-size: .62rem; letter-spacing: .22em;
  text-transform: uppercase;
  padding: .95rem 1.85rem;
  border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent);
  color: var(--fg);
  background: color-mix(in srgb, var(--glass) 80%, transparent);
  backdrop-filter: blur(16px);
  border-radius: 999px;
  opacity: 0; animation: fadeUp .9s ease .65s forwards;
  transition: border-color .3s, box-shadow .3s, transform .3s, background .3s;
  position: relative; overflow: hidden;
}
.cta::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 30%, color-mix(in srgb, var(--gold) 22%, transparent) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform .7s ease;
}
.cta:hover {
  border-color: var(--gold);
  box-shadow: 0 0 36px var(--accent-soft);
  transform: translateY(-2px);
}
.cta:hover::before { transform: translateX(120%); }
.cta .arrow { transition: transform .3s; }
.cta:hover .arrow { transform: translateX(3px); }

.scroll-hint {
  position: absolute; z-index: 2; bottom: 1.6rem; left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono); font-size: .5rem; letter-spacing: .28em;
  color: var(--muted); text-transform: uppercase;
  opacity: 0; animation: fadeUp .8s ease 1.1s forwards;
}
.scroll-hint::after {
  content: ""; display: block; width: 1px; height: 2.2rem; margin: .55rem auto 0;
  background: linear-gradient(180deg, var(--gold), transparent);
  animation: pulseLine 2.4s ease-in-out infinite;
}
@keyframes pulseLine {
  0%, 100% { opacity: .35; transform: scaleY(.85); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ---- Visual chapters (glass / depth) ---- */
.chapter {
  position: relative; min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  padding: 5rem 1.5rem;
  border-top: 1px solid transparent;
}
.chapter-bg {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: var(--glow); opacity: .55;
}
.chapter-inner {
  position: relative; z-index: 1; width: min(100%, var(--maxw));
}

.glass {
  border: 1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(1.15);
  border-radius: 1.25rem;
  padding: clamp(1.6rem, 4vw, 2.6rem);
  box-shadow:
    0 30px 80px color-mix(in srgb, #000 35%, transparent),
    inset 0 1px 0 color-mix(in srgb, var(--platinum) 12%, transparent);
  transform: translateY(28px); opacity: 0;
  transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);
}
.glass.on { opacity: 1; transform: none; }

.chapter-label {
  font-family: var(--mono); font-size: .52rem; letter-spacing: .32em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 1rem;
}
.chapter-title {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(2rem, 5.5vw, 3.6rem); line-height: 1.15;
  letter-spacing: -.01em; margin-bottom: .85rem;
}
.chapter-title em {
  font-style: italic;
  background: linear-gradient(90deg, var(--gold), var(--cyan));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.chapter-note {
  font-size: .88rem; color: var(--fg-dim); max-width: 28rem;
}

/* Floating panel grid */
.float-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
  margin-top: 1.8rem;
}
.float-card {
  aspect-ratio: 4/5; border-radius: 1rem;
  border: 1px solid var(--glass-border);
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--bg2) 70%, transparent), transparent),
    radial-gradient(circle at 30% 25%, var(--accent-soft), transparent 55%),
    radial-gradient(circle at 80% 80%, var(--accent2-soft), transparent 50%);
  position: relative; overflow: hidden;
  animation: floatY 6s ease-in-out infinite;
}
.float-card:nth-child(2) { animation-delay: -.8s; animation-duration: 7.2s; }
.float-card:nth-child(3) { animation-delay: -1.6s; animation-duration: 5.4s; }
@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.float-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--platinum) 14%, transparent) 50%, transparent 65%);
  transform: translateX(-100%);
  animation: sweep 5.5s ease-in-out infinite;
}
.float-card:nth-child(2)::after { animation-delay: 1.2s; }
.float-card:nth-child(3)::after { animation-delay: 2.4s; }
@keyframes sweep {
  0%, 35% { transform: translateX(-100%); }
  65%, 100% { transform: translateX(100%); }
}
.float-card .tag {
  position: absolute; inset: auto 1rem 1rem 1rem;
  font-family: var(--mono); font-size: .48rem; letter-spacing: .2em;
  color: var(--muted); text-transform: uppercase;
}

/* Spec UI chrome (visual only) */
.spec-frame {
  margin-top: 1.6rem; aspect-ratio: 16/9;
  border-radius: 1rem; border: 1px solid var(--glass-border);
  background: color-mix(in srgb, var(--bg) 80%, var(--bg2));
  overflow: hidden; position: relative;
  box-shadow: 0 20px 50px color-mix(in srgb, #000 30%, transparent);
}
.spec-bar {
  display: flex; gap: .35rem; padding: .55rem .7rem;
  border-bottom: 1px solid var(--border); background: var(--bg2);
}
.spec-bar i {
  width: .4rem; height: .4rem; border-radius: 50%; background: var(--muted); display: block;
}
.spec-bar i:nth-child(1) { background: color-mix(in srgb, var(--gold) 70%, #fff); }
.spec-bar i:nth-child(2) { background: color-mix(in srgb, var(--cyan) 60%, #fff); }
.spec-bar i:nth-child(3) { background: color-mix(in srgb, var(--magenta) 55%, #fff); }
.spec-body {
  height: calc(100% - 2rem); display: grid; place-items: center;
  position: relative; overflow: hidden;
}
.spec-pulse {
  width: min(48%, 220px); aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  box-shadow: 0 0 40px var(--accent-soft), inset 0 0 30px var(--accent2-soft);
  animation: breathe 4.5s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(.92); opacity: .65; }
  50% { transform: scale(1.05); opacity: 1; }
}
.spec-body::before {
  content: "SPEC"; position: absolute; inset: auto auto 1rem 1rem;
  font-family: var(--mono); font-size: .5rem; letter-spacing: .24em; color: var(--muted);
}

/* Closing stage */
.close-stage {
  min-height: 88svh; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 5rem 1.5rem; position: relative;
}
.close-stage::before {
  content: ""; position: absolute; inset: 15% 10%; pointer-events: none;
  background: var(--glow); opacity: .7;
}
.close-title {
  position: relative;
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.15;
  margin-bottom: 2rem;
}
.close-title em {
  font-style: italic;
  background: linear-gradient(90deg, var(--gold), var(--cyan));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

footer {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: .8rem; padding: 1.4rem 1.5rem 2rem;
  font-size: .68rem; color: var(--muted); border-top: 1px solid var(--border);
}
footer a { color: var(--fg-dim); transition: color .25s; }
footer a:hover { color: var(--gold); }
.store-back {
  font-family: var(--mono); font-size: .58rem; letter-spacing: .12em;
  opacity: .75;
}
.store-back:hover { opacity: 1; }

@media (max-width: 820px) {
  .float-grid { grid-template-columns: 1fr; gap: .75rem; }
  .float-card { aspect-ratio: 16/9; animation-duration: 5s; }
  .rail { right: .7rem; gap: .55rem; }
  .rail a { width: 6px; height: 6px; }
  .chrome { padding: 1rem 1.1rem; }
  .chapter { padding: 4rem 1.1rem; min-height: auto; }
  .stage-content { padding: 5.5rem 1.1rem 3.5rem; }
}

/* アクセシビリティ: 動きを減らす */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .k-word .k-inner,
  .k-line, .cta, .scroll-hint {
    animation: none !important; opacity: 1; transform: none;
  }
  .k-word .k-inner {
    background: linear-gradient(105deg, var(--platinum), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .float-card, .float-card::after, .spec-pulse, .scroll-hint::after {
    animation: none !important;
  }
  .glass { opacity: 1; transform: none; transition: none; }
  .stage-media video { display: none; }
  .stage-media .hero-poster-fallback { display: block; opacity: .5; }
  .cursor-glow { display: none !important; }
}
.stage-media .hero-poster-fallback { display: none; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<header class="chrome">
  <!-- EDIT: プロダクト / ブランド名 -->
  <a href="#hero" class="wordmark">Pulse</a>
  <div class="chrome-right">
    <button type="button" class="theme-btn" id="themeToggle" aria-label="テーマ切替">THEME</button>
  </div>
</header>

<!-- シンボルナビ（セクションアンカー） -->
<nav class="rail" aria-label="セクション">
  <a href="#hero" class="is-active" data-sec="hero"><span>Hero</span></a>
  <a href="#depth" data-sec="depth"><span>Depth</span></a>
  <a href="#motion" data-sec="motion"><span>Motion</span></a>
  <a href="#cta" data-sec="cta"><span>CTA</span></a>
</nav>

<section class="stage" id="hero">
  <!--
    ヒーロー動画（プライマリ・キャンバス）:
    - playsinline autoplay muted loop preload=metadata
    - sources: media/hero-loop.webm + media/hero-loop.mp4
    - poster: media/hero-poster.jpg
    - prefers-reduced-motion では JS / CSS で停止し poster のみ
  -->
  <div class="stage-media" aria-hidden="true" id="heroMedia">
    <video
      id="heroVideo"
      playsinline
      autoplay
      muted
      loop
      preload="metadata"
      poster="media/hero-poster.jpg">
      <source src="media/hero-loop.webm" type="video/webm">
      <source src="media/hero-loop.mp4" type="video/mp4">
    </video>
    <img class="hero-poster-fallback" src="media/hero-poster.jpg" alt="" width="1920" height="1080">
  </div>
  <div class="stage-vignette" aria-hidden="true"></div>

  <div class="stage-content">
    <!-- EDIT: ワードマーク（1語） -->
    <h1 class="k-word"><span class="k-inner">PULSE</span></h1>
    <!-- EDIT: 短い1行（それ以上は書かない） -->
    <p class="k-line">映像が、静かに脈を打つ。</p>
    <!-- EDIT: プライマリ CTA のみ -->
    <a href="#cta" class="cta">Enter <span class="arrow" aria-hidden="true">→</span></a>
  </div>
  <p class="scroll-hint" aria-hidden="true">Scroll</p>
</section>

<section class="chapter" id="depth">
  <div class="chapter-bg" aria-hidden="true"></div>
  <div class="chapter-inner">
    <div class="glass rv">
      <p class="chapter-label">01 — Depth</p>
      <!-- EDIT: 見出しは短く。長文は置かない -->
      <h2 class="chapter-title">層とガラス。<em>余白</em>が語る。</h2>
      <p class="chapter-note">ショールームのように、光と反射だけで空気を作る。説明文は最小限。</p>
      <div class="float-grid" aria-hidden="true">
        <div class="float-card"><span class="tag">Panel</span></div>
        <div class="float-card"><span class="tag">Glass</span></div>
        <div class="float-card"><span class="tag">Light</span></div>
      </div>
    </div>
  </div>
</section>

<section class="chapter" id="motion">
  <div class="chapter-bg" aria-hidden="true"></div>
  <div class="chapter-inner">
    <div class="glass rv">
      <p class="chapter-label">02 — Motion</p>
      <!-- EDIT: 見出し -->

<script>
// テーマ切替（localStorage）
(function () {
  const root = document.documentElement;
  const key = 'pulse-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem(key, next);
  });
})();

// ヒーロー動画: reduced-motion では停止・ポスターのみ
(function () {
  const video = document.getElementById('heroVideo');
  if (!video) return;
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const apply = () => {
    if (mq.matches) {
      video.pause();
      video.removeAttribute('autoplay');
      video.style.display = 'none';
    } else {
      video.style.display = '';
      video.setAttribute('autoplay', '');
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  };
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else if (mq.addListener) mq.addListener(apply);
})();

// スクロールリビール
(function () {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); }
    });
  }, { threshold: 0.14 });
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
})();

// シンボルナビ active
(function () {
  const links = [...document.querySelectorAll('.rail a')];
  const ids = links.map(a => a.getAttribute('data-sec'));
  const secs = ids.map(id => document.getElementById(id)).filter(Boolean);
  if (!secs.length) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const id = e.target.id;
      links.forEach(a => a.classList.toggle('is-active', a.getAttribute('data-sec') === id));
    });
  }, { threshold: 0.45 });
  secs.forEach(s => io.observe(s));
})();

// 微パララックス（動画）+ カーソルグロー
(function () {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const video = document.querySelector('#heroMedia video');
  const glow = document.getElementById('cursorGlow');
  const media = document.getElementById('heroMedia');
  if (mq.matches) return;

  let mx = 0.5, my = 0.5, sx = 0.5, sy = 0.5;
  let scrollY = 0;

  window.addEventListener('pointermove', (e) => {
    mx = e.clientX / window.innerWidth;
    my = e.clientY / window.innerHeight;
    if (glow) {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    }
  }, { passive: true });

  window.addEventListener('scroll', () => { scrollY = window.scrollY || 0; }, { passive: true });

  function tick() {
    sx += (mx - sx) * 0.06;
    sy += (my - sy) * 0.06;
    if (video && media) {
      const px = (sx - 0.5) * 12;
      const py = (sy - 0.5) * 8 + Math.min(scrollY * 0.04, 40);
      video.style.transform = 'scale(1.06) translate(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px)';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
