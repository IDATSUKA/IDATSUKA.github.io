// roundRect polyfill (iOS < 16.4)

  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r){
    r = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
  };
}

const IMG_Y = T.IMG_Y, IMG_H = T.PHOTO_H * T.IMG_K, BAND_Y = IMG_Y + IMG_H;   // photo spans 230..750

// SOUND — synthesized cabinet: solenoids, rubber, switches, rolling ball
// ════════════════════════════════════════════
let muted = store.get('aurora_mute', '0') === '1';
let AC = null, OUT = null, NB = null, roll = null;
function audio(){
  if (muted) return null;
  if (!AC){
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    try { AC = new A(); } catch (e){ return null; }
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.12;
    OUT = AC.createGain(); OUT.gain.value = 0.85;
    OUT.connect(comp); comp.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  if (!roll) rollInit();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(f0, 1), t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol, t0 + 0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(OUT); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, fc, q, ftype, delay, fc1){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const s = a.createBufferSource(); s.buffer = NB; s.loop = true;      // long sweeps outlast the 1 s buffer
  const f = a.createBiquadFilter(); f.type = ftype || 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(fc, t0); if (fc1) f.frequency.exponentialRampToValueAtTime(fc1, t0 + dur);
  const gn = a.createGain();
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(gn); gn.connect(OUT);
  s.start(t0, Math.random() * 0.6); s.stop(t0 + dur + 0.02);
}
function rollInit(){
  if (!AC || roll) return;
  const s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; f.Q.value = 0.8;
  const gn = AC.createGain(); gn.gain.value = 0;
  s.connect(f); f.connect(gn); gn.connect(OUT); s.start();
  roll = { f, g: gn };
}
function rollUpdate(){
  if (!roll || !AC) return;
  let s = 0;
  for (const b of balls){
    if (b.plugin.held) continue;
    const v = b.plugin.guide ? Math.abs(b.plugin.guide.v) * 1.3 : Math.hypot(b.velocity.x, b.velocity.y);
    s = Math.max(s, v);
  }
  const tgt = muted ? 0 : Math.min(0.2, s * 0.016);
  roll.g.gain.setTargetAtTime(tgt, AC.currentTime, 0.06);
  roll.f.frequency.setTargetAtTime(160 + s * 45, AC.currentTime, 0.06);
}
const seq = (notes, step, type, vol, delay) => notes.forEach((f, i) => { if (f) tone(f, f * 1.001, step * 0.92, type, vol, (delay || 0) + i * step); });
const N = { C4: 262, D4: 294, E4: 330, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, A5: 880, B5: 988, C6: 1047, E6: 1319, G6: 1568 };

  nudge:    () => { noise(0.08, 0.6, 180, 1, 'lowpass'); tone(70, 40, 0.1, 'sine', 0.4); },
  danger:   () => { tone(880, 880, 0.12, 'square', 0.15); tone(660, 660, 0.12, 'square', 0.15, 0.15); },
  tilt:     () => tone(200, 60, 0.9, 'square', 0.18),
  count:    () => tone(1760, 1760, 0.03, 'square', 0.06),

  start:    () => seq([N.C5, N.E5, N.G5, N.C6], 0.08, 'triangle', 0.14),
  over:     () => seq([N.C5, N.G4, N.E4, N.C4], 0.2, 'triangle', 0.15),
  select:   () => tone(1320, 1320, 0.05, 'square', 0.08),
  railStop: () => { noise(0.04, 0.5, 2800, 3); tone(1760, 1700, 0.09, 'triangle', 0.08); },
  charge:   () => { tone(70, 520, 1.05, 'sawtooth', 0.05); tone(140, 1040, 1.05, 'square', 0.02); noise(1.0, 0.12, 300, 2, 'bandpass', 0, 2600); },
  railFire: () => { noise(0.09, 0.9, 700, 0.8, 'lowpass'); tone(130, 45, 0.16, 'sine', 0.7); tone(2200, 300, 0.12, 'square', 0.05); },

// ════════════════════════════════════════════
// DOT-MATRIX DISPLAY (128 × 32, 16 shades)
// ════════════════════════════════════════════
const DW = 128, DH = 32, DP = 2.66;
const DWP = DW * DP, DHP = DH * DP, DX = (W - DWP) / 2, DY = 64;
const dbuf = new Uint8Array(DW * DH);
const FONT_SRC = {
  'A':'01110100011000111111100011000110001','B':'11110100011000111110100011000111110','C':'01110100011000010000100001000101110',
  'D':'11100100101000110001100011001011100','E':'11111100001000011110100001000011111','F':'11111100001000011110100001000010000',
  'G':'01110100011000010111100011000101111','H':'10001100011000111111100011000110001','I':'01110001000010000100001000010001110',
  'J':'00111000100001000010000101001001100','K':'10001100101010011000101001001010001','L':'10000100001000010000100001000011111',
  'M':'10001110111010110101100011000110001','N':'10001100011100110101100111000110001','O':'01110100011000110001100011000101110',
  'P':'11110100011000111110100001000010000','Q':'01110100011000110001101011001001101','R':'11110100011000111110101001001010001',
  'S':'01111100001000001110000010000111110','T':'11111001000010000100001000010000100','U':'10001100011000110001100011000101110',
  'V':'10001100011000110001100010101000100','W':'10001100011000110101101011010101010','X':'10001100010101000100010101000110001',
  'Y':'10001100011000101010001000010000100','Z':'11111000010001000100010001000011111',
  '0':'01110100011001110101110011000101110','1':'00100011000010000100001000010001110','2':'01110100010000100010001000100011111',
  '3':'11111000100010000010000011000101110','4':'00010001100101010010111110001000010','5':'11111100001111000001000011000101110',
  '6':'00110010001000011110100011000101110','7':'11111000010001000100010000100001000','8':'01110100011000101110100011000101110',
  '9':'01110100011000101111000010001001100',
  ' ':'00000000000000000000000000000000000','!':'00100001000010000100001000000000100','?':'01110100010000100010001000000000100',
  '.':'00000000000000000000000000110001100',',':'00000000000000000000011000010001000',':':'00000011000110000000011000110000000',
  '-':'00000000000000011111000000000000000','+':'00000001000010011111001000010000000','/':'00000000010001000100010001000000000',
  "'":'00100001000100000000000000000000000','*':'00000100010101000100010101000100000','<':'00010001000100010000010000010000010',
  '>':'01000001000001000001000100010001000','=':'00000000001111100000111110000000000','(':'00010001000100001000010000010000010',
  ')':'01000001000001000010000100010001000','&':'01100100101010001000101011001001101','#':'01010010101111101010111110101001010',
  '%':'11000110010001000100010001001100011','^':'00100011101010100100001000010000100','_':'00000000000000000000000000000011111',
};
const FONT = {};
for (const ch in FONT_SRC){
  const s = FONT_SRC[ch], px = [];
  let x0 = 5, x1 = -1;
  for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (s[y * 5 + x] === '1'){ px.push([x, y]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
  const narrow = '.,:!\''.includes(ch);
  if (narrow){ for (const p of px) p[0] -= x0; }
  FONT[ch] = { px, w: ch === ' ' ? 3 : narrow ? x1 - x0 + 1 : 5 };
}
function dClear(v){ dbuf.fill(v || 0); }
function dPix(x, y, v){ x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < DW && y < DH) dbuf[y * DW + x] = v; }
function dRect(x, y, w, h, v){ for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) dPix(x + i, y + j, v); }
function dFrame(x, y, w, h, v){ for (let i = 0; i < w; i++){ dPix(x + i, y, v); dPix(x + i, y + h - 1, v); } for (let j = 0; j < h; j++){ dPix(x, y + j, v); dPix(x + w - 1, y + j, v); } }
function dLine(x0, y0, x1, y1, v){
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) dPix(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), v);
}
function tWidth(str, s){ let w = 0; for (const ch of str){ const f = FONT[ch] || FONT['?']; w += (f.w + 1) * s; } return Math.max(0, w - s); }
function dText(str, x, y, s, v, align){
  s = s || 1; v = v == null ? 15 : v; str = String(str).toUpperCase();
  const w = tWidth(str, s);
  if (align === 'c') x -= Math.floor(w / 2); else if (align === 'r') x -= w;
  for (const ch of str){
    const f = FONT[ch] || FONT['?'];
    for (const [px, py] of f.px) dRect(x + px * s, y + py * s, s, s, v);
    x += (f.w + 1) * s;
  }
  return w;
}
// biggest scale that fits the panel
function fitScale(str, maxS){ for (let s = maxS; s > 1; s--) if (tWidth(str, s) <= DW - 4) return s; return 1; }
const fmt = n => Math.round(n).toLocaleString('en-US');

// DMD canvases
const dcv = document.createElement('canvas'); dcv.width = DW; dcv.height = DH;
const dctx = dcv.getContext('2d');
const dimg = dctx.createImageData(DW, DH);
let dmask = null;
function buildDmdMask(){
  const w = Math.max(1, Math.round(DWP * SC)), h = Math.max(1, Math.round(DHP * SC));
  dmask = document.createElement('canvas'); dmask.width = w; dmask.height = h;
  const m = dmask.getContext('2d');
  m.fillStyle = '#050302'; m.fillRect(0, 0, w, h);
  m.globalCompositeOperation = 'destination-out';
  const p = DP * SC, r = p * 0.41;
  m.beginPath();
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++){ const cx = (x + 0.5) * p, cy = (y + 0.5) * p; m.moveTo(cx + r, cy); m.arc(cx, cy, r, 0, TAU); }
  m.fill();
}
const DCOL = []; // shade -> rgba
for (let v = 0; v < 16; v++){ const f = v / 15; DCOL.push([255 * Math.min(1, f * 1.05), 150 * Math.pow(f, 1.15), 50 * Math.pow(f, 1.6), v ? 255 : 0]); }
function dmdBlit(){
  const d = dimg.data;
  for (let i = 0, o = 0; i < DW * DH; i++, o += 4){ const c = DCOL[dbuf[i]]; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = c[3]; }
  dctx.putImageData(dimg, 0, 0);
}

// ── scenes: timed DMD animations with priority; the base screen shows otherwise
let scene = null; const sceneQ = [];
// higher priority interrupts (the interrupted one resumes after); equal
// priority queues, except minor (pri 1) updates which just replace each other
function show(fn, dur, pri){
  const s = { fn, dur, pri: pri || 1, t0: now() };
  if (!scene || s.pri > scene.pri || (s.pri === 1 && scene.pri === 1)){
    if (scene && scene.pri > 1) sceneQ.unshift(scene);
    scene = s;
  } else if (s.pri > 1){ sceneQ.push(s); sceneQ.sort((a, b) => b.pri - a.pri); if (sceneQ.length > 6) sceneQ.pop(); }
}
function clearScenes(){ scene = null; sceneQ.length = 0; }
const blink = (e, ms) => (e / ms | 0) % 2 === 0;
// big headline + small line; flash = blink the headline, inv = inverse flash
function sText(l1, l2, opt){
  opt = opt || {};
  return (e, dur) => {
    if (opt.inv && e < 360 && blink(e, 90)) dClear(15);
    const bg = dbuf[0] ? 0 : 15;
    if (opt.border) borderChase(e, bg);
    if (opt.sparkle) sparkle(e);
    const vis = !opt.flash || e > 700 || blink(e, 110);
    const s1 = fitScale(l1, l2 ? 2 : 3);
    const zoom = opt.zoom && e < 180 ? Math.max(1, Math.round(s1 * e / 180)) : s1;
    const y1 = l2 ? (zoom >= 2 ? 3 : 7) : Math.round((DH - 7 * zoom) / 2);
    if (vis) dText(l1, 64, y1, zoom, bg, 'c');
    if (l2) dLine2(typeof l2 === 'function' ? l2(e) : l2, 23, bg ? 11 : 4, e);
  };
}
// small line: centred when it fits, otherwise it scrolls through once and holds
function dLine2(str, y, v, e){
  const w = tWidth(str.toUpperCase(), 1);
  if (w <= DW - 4){ dText(str, 64, y, 1, v, 'c'); return; }
  const x = Math.max(DW - 2 - w, 2 - Math.max(0, e - 500) * 0.04);
  dText(str, Math.round(x), y, 1, v);
}
function borderChase(e, v){
  const per = 2 * (DW + DH) - 4, off = (e / 12) | 0;
  for (let i = 0; i < per; i += 1){
    if (((i + off) % 8) > 3) continue;
    let x, y;
    if (i < DW){ x = i; y = 0; } else if (i < DW + DH - 1){ x = DW - 1; y = i - DW + 1; }
    else if (i < 2 * DW + DH - 2){ x = DW - 1 - (i - DW - DH + 2); y = DH - 1; } else { x = 0; y = DH - 1 - (i - 2 * DW - DH + 3); }
    dPix(x, y, v ? 12 : 3);
  }
}
let sparks = [];
function sparkle(e){
  if (sparks.length < 40) for (let i = 0; i < 3; i++) sparks.push({ x: Math.random() * DW | 0, y: Math.random() * DH | 0, v: 15 });
  sparks = sparks.filter(s => (s.v -= 1) > 0);
  for (const s of sparks) dPix(s.x, s.y, s.v);
}
function sScroll(text, speed){
  return (e) => {
    const w = tWidth(text, 2), x = DW - (e * (speed || 0.06)) % (w + DW);
    dText(text, x | 0, 9, 2, 15);
  };
}
function sCount(label, value, sub){
  return (e) => {
    dText(label, 64, 2, 1, 10, 'c');
    const v = Math.min(1, e / 380);
    dText(fmt(value * v), 64, 12, 2, 15, 'c');
    if (sub) dText(sub, 64, 27, 1, 5, 'c');
  };
}
// Aurora "A" mark
function dLogo(cx, cy, s, v){
  dLine(cx, cy - 7 * s, cx - 7 * s, cy + 6 * s, v); dLine(cx, cy - 7 * s, cx + 7 * s, cy + 6 * s, v);
  dLine(cx - 7 * s, cy + 6 * s, cx + 7 * s, cy + 6 * s, v); dLine(cx - 3 * s, cy + 2 * s, cx + 3 * s, cy + 2 * s, v);
}

// ════════════════════════════════════════════
// TABLE + GAME STATE
// ════════════════════════════════════════════
const tb = T.build(Matter);
const LF = tb.LF, RF = tb.RF;
const PH0 = { x: tb.plungerHead.position.x, y: tb.plungerHead.position.y };
const now = () => performance.now();

const MODES = [
  { name: 'INITIATE',  goal: 'POP BUMPERS',  need: 10, ev: 'bumper',  each: 5000,  done: 75000,  secs: 30 },
  { name: 'ASSEMBLE',  goal: 'DROP TARGETS', need: 4,  ev: 'target',  each: 15000, done: 125000, secs: 35 },
  { name: 'CALIBRATE', goal: 'ORBIT SHOTS',  need: 2,  ev: 'orbit',   each: 40000, done: 175000, secs: 40 },
  { name: 'INNOVATE',  goal: 'RAMP SHOTS',   need: 2,  ev: 'ramp',    each: 50000, done: 250000, secs: 40 },
  { name: 'ELEVATE',   goal: 'SHOOT SCOOP',  need: 1,  ev: 'scoop',   each: 0,     done: 500000, secs: 45 },
];
const LOCK_WORDS = ['ORBIT', 'LIGHT', 'LOCK'];
const BALLS_PER_GAME = 3, SAVE_MS = 10000, REPLAY_AT = 8000000;
const HS_KEY = 'aurora_hs4';
const HS_DEFAULT = [
  { n: 'AUR', s: 20000000 }, { n: 'IDA', s: 12000000 }, { n: 'SYS', s: 8000000 }, { n: 'VEC', s: 5000000 }, { n: 'ORB', s: 2500000 },
];
function loadHS(){
  const read = k => { try { const a = JSON.parse(store.get(k, '')); return Array.isArray(a) ? a : null; } catch (e){ return null; } };
  const cur = read(HS_KEY); if (cur && cur.length) return cur.slice(0, 5);
  // first run of this version: keep the player's own entries from the old
  // table, drop its too-easy factory defaults
  const oldDefaults = new Set(['AUR', 'IDA', 'SYS', 'VEC', 'ORB']);
  const mine = (read('aurora_hs3') || []).filter(h => h && !oldDefaults.has(h.n) && h.s > 0);
  return HS_DEFAULT.map(x => Object.assign({}, x)).concat(mine).sort((a, b) => b.s - a.s).slice(0, 5);
}
let hiscores = loadHS();
let credits = +store.get('aurora_credits', '0') || 0;

let state = 'attract';    // attract | play | bonus | entry | over
let clock = 0;            // game time (ms), advances with the physics
let timers = [];
function later(ms, fn){ timers.push({ at: clock + ms, fn }); }
let balls = [];
let gm = null;            // per-game state
let lastScore = 0;
let gi = 1, giTarget = 1; // general illumination
let flashFx = 0, shake = 0;
let plVis = 0, plVel = 0, pull = 0, pulling = false;
let entry = null;         // initials entry
let attractT0 = 0;

function newGame(){
  return {
    score: 0, ball: 1, extraBalls: 0, replayed: false,
    ladder: 0, level: 1, modeLit: true, modeRun: null, modesDone: 0, extraLit: false, extraGiven: 0,
    lockWords: 0, lockLit: false, locked: 0, mb: false, mbCount: 0, jpCount: 0, jackpots: 0, superLit: false,
    bankValue: 25000, banks: 0, superPopsUntil: 0, scoops: 0,
    lastShot: '', lastShotAt: -1e9,

  };
}
function newBallState(){
  return {

}

function x3(){ return gm && gm.modeRun && gm.modeRun.i === 4 ? 3 : 1; }
function score(p){
  if (state !== 'play' || !gm || gm.b.tilted) return 0;
  const v = p * x3();
  gm.score += v;
  if (!gm.replayed && gm.score >= REPLAY_AT){
    gm.replayed = true; credits++; store.set('aurora_credits', credits);
    sfx.knock(); show(sText('REPLAY', 'FREE GAME AWARDED', { flash: true }), 1800, 3);
  }

}

// ── balls ───────────────────────────────────────────
function serveBall(auto){
  const b = tb.addBall(T.BALL_START.x, T.BALL_START.y);
  b.plugin.inLane = true;
  balls.push(b);
  noise(0.08, 0.5, 500, 1, 'lowpass');           // trough kicker
  if (auto) later(450, () => autoLaunch(b));
  return b;
}
function laneBall(){ return balls.find(b => b.plugin.inLane && !b.plugin.guide && b.position.y > T.BALL_START.y - 30); }
function launch(b, power){
  if (!b) return;
  if (b.position.y > T.BALL_START.y) Body.setPosition(b, { x: T.BALL_START.x, y: T.BALL_START.y });
  const v = T.LAUNCH_MIN + T.LAUNCH_RNG * power * (0.985 + Math.random() * 0.03);
  Body.setVelocity(b, { x: 0, y: -v });
  sfx.launch(power);
}
function autoLaunch(b){
  if (!balls.includes(b) || !b.plugin.inLane) return;
  plVis = 0.9; plVel = 0;
  later(160, () => { launch(b, 0.85); plRelease(); });
}
function plRelease(){ plVel = -0.32; }
function removeBall(b){ const i = balls.indexOf(b); if (i >= 0) balls.splice(i, 1); tb.removeBall(b); }
const parked = b => !!(b.plugin.guide && b.plugin.guide.parked);
const activeBalls = () => balls.filter(b => !parked(b));

// ── the right wire rail: it ends in a closed loop, not an exit ─────────
// A ball that rides it down stops at the loop. A lock holds it there
// (visible, like a real physical lock); otherwise the rail's magnet charges
// up and fires it off the end of the wire into the right inlane.
let railFx = null;           // { t0, dur } while charging
let railBursts = [];         // release flashes
function railArrive(b, kind){
  sfx.railStop(); flashLamp('rail', 0.8);
  if (!gm || state !== 'play' || gm.b.tilted){ later(500, railRelease); return; }
  if (majorShot(kind || 'orbit', b) === 'lock'){ b.plugin.locked = true; sfx.lockHold(); return; }
  railCharge(1100);
}
function railCharge(ms){
  railFx = { t0: clock, dur: ms };
  sfx.charge();
  later(ms, railRelease);
}
function railRelease(){
  const b = T.releaseRail(tb); if (!b) return;
  if (b.plugin.locked && gm) gm.locked = Math.max(0, gm.locked - 1);
  b.plugin.locked = false;
  railFx = null;
  const p = { x: b.position.x, y: b.position.y };
  railBursts.push({ x: p.x, y: p.y, t0: now() });
  sfx.railFire(); flashLamp('rail', 1); shake = Math.max(shake, 0.25);
}

// ── game flow ───────────────────────────────────────
function startGame(){
  balls.slice().forEach(removeBall);
  tb.targets.forEach(t => { T.dropTarget(t, false); t.plugin.sink = 0; t.plugin.fl = 0; });
  timers = []; clearScenes();
  gm = newGame(); gm.b = newBallState(); railFx = null; railBursts = [];
  state = 'play'; giTarget = 1; lastScore = 0;
  LF.on = RF.on = false;
  sfx.start();
  show(sText('PLAYER 1', 'SKILL SHOT: SOFT PLUNGE', { border: true }), 2200, 2);
  later(700, () => serveBall(false));
}
function startBall(){
  gm.b = newBallState();
  giTarget = 1;
  show(sText('BALL ' + gm.ball, 'SKILL SHOT: SOFT PLUNGE', {}), 1800, 2);
  later(500, () => serveBall(false));
}
function onDrain(b){
  removeBall(b);
  if (state !== 'play') return;
  const B = gm.b;
  if (!B.tilted && clock < B.saveUntil + 1500){        // ball save (with a short hidden grace)
    sfx.save(); show(sText('BALL SAVED', 'SHOOT AGAIN', { flash: true }), 1500, 3);
    serveBall(true);
    return;
  }
  if (gm.mb){
    if (balls.length <= 1) endMultiball();
    if (balls.length) return;
  }
  if (activeBalls().length) return;
  if (tb.rail.some(x => !x.plugin.locked)) return;        // on its way back off the wire
  endBall();                                             // locked balls stay locked
}
function endMultiball(){
  gm.mb = false; gm.superLit = false; gm.jpCount = 0;
  show(sText('MULTIBALL', 'JACKPOTS ' + gm.jackpots, {}), 1600, 2);
}
function endBall(){
  const B = gm.b;
  if (gm.mb) endMultiball();
  if (gm.modeRun) modeEnd(false, true);
  state = 'bonus'; giTarget = 0.25;
  LF.on = RF.on = false;
  sfx.drain();
  const items = [];
  if (!B.tilted){
    items.push(['POP BUMPERS ' + B.pops, B.pops * 500]);
    items.push(['DROP TARGETS ' + B.targets, B.targets * 2500]);
    items.push(['INLANES ' + B.lanes, B.lanes * 2000]);
    items.push(['MAJOR SHOTS ' + B.shots, B.shots * 10000]);
    items.push(['MODES ' + B.modes, B.modes * 50000]);
  }
  const base = items.reduce((a, it) => a + it[1], 0), total = base * B.bonusX;
  let t = 0;
  const step = ms => (t += ms);
  if (B.tilted){ later(step(1800), () => {}); }
  else {
    later(step(300), () => show(sText('BONUS', '', {}), 900, 5));
    items.forEach(([lab, v]) => later(step(950), () => { sfx.count(); show(sCount(lab, v), 950, 5); }));
    later(step(950), () => { sfx.bonusX(); show(sText('BONUS X ' + B.bonusX, '', {}), 950, 5); });
    later(step(950), () => { sfx.count(); gm.score += total; show(sCount('TOTAL BONUS', total), 1300, 5); });
    step(1300);
  }
  later(step(200), () => {
    clearScenes();
    if (gm.extraBalls > 0){
      gm.extraBalls--;
      state = 'play'; show(sText('SHOOT AGAIN', 'SAME PLAYER', { flash: true }), 1800, 3); sfx.extra();
      gm.b = newBallState(); giTarget = 1; later(600, () => serveBall(false));
    } else if (gm.ball < BALLS_PER_GAME){
      gm.ball++; state = 'play'; startBall();
    } else gameOver();
  });
}
function gameOver(){
  lastScore = gm.score;
  const rank = hiscores.findIndex(h => gm.score > h.s);
  if (rank >= 0 && gm.score > 0){
    state = 'entry'; giTarget = 0.5;
    entry = { rank, letters: [0, 0, 0], pos: 0, t0: clock, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ ' };
    sfx.extra();
    show(sText('GREAT SCORE', 'ENTER YOUR INITIALS', { border: true }), 1800, 4);
  } else finishGame();
}
function finishGame(){
  state = 'over'; giTarget = 0.5; sfx.over();
  for (let i = 0; i < tb.rail.length; i++) later(600 + i * 700, railRelease);   // eject the locked balls
  const matchN = (Math.random() * 10 | 0) * 10, mine = Math.floor(lastScore / 10) % 10 * 10;
  show(sText('GAME OVER', 'SCORE ' + fmt(lastScore), {}), 2600, 4);
  show((e) => {
    const spin = e < 1600 ? (Math.floor(e / 70) % 10) * 10 : matchN;
    dText('MATCH', 30, 3, 2, 12, 'c'); dText(String(spin).padStart(2, '0'), 30, 19, 1, 15, 'c');
    dText(String(mine).padStart(2, '0'), 98, 12, 2, 10, 'c');
    if (e > 1600 && matchN === mine && blink(e, 150)) dText('MATCH!', 98, 3, 1, 15, 'c');
  }, 2800, 4);
  later(5600, () => {
    if (matchN === mine){ credits++; store.set('aurora_credits', credits); sfx.knock(); }
    state = 'attract'; attractT0 = now(); gm = null; giTarget = 1;
  });
}
function entryInput(dir){
  if (!entry) return;
  const n = entry.chars.length;
  if (dir === 'sel'){
    sfx.select(); entry.pos++;
    if (entry.pos >= 3){
      const name = entry.letters.map(i => entry.chars[i]).join('').trim() || 'YOU';
      hiscores.splice(entry.rank, 0, { n: name, s: lastScore }); hiscores = hiscores.slice(0, 5);
      store.set(HS_KEY, JSON.stringify(hiscores));
      entry = null; finishGame();
    }
  } else { entry.letters[entry.pos] = (entry.letters[entry.pos] + (dir > 0 ? 1 : n - 1)) % n; sfx.select(); }
}

// ── rules ───────────────────────────────────────────
function modeStart(){
  const m = MODES[gm.ladder];
  gm.modeLit = false;
  gm.modeRun = { i: gm.ladder, hits: 0, end: clock + m.secs * 1000 };
  sfx.modeStart(); flashFx = 0.5;
  show(sText(m.name, gm.modeRun.i === 4 ? '3X SCORING + ' + m.goal : m.goal + ' ' + m.need, { zoom: true, border: true }), 2200, 3);
}
function modeProgress(kind, pos){
  const r = gm.modeRun; if (!r) return;
  const m = MODES[r.i]; if (m.ev !== kind) return;
  r.hits++;
  if (m.each) score(m.each * gm.level);
  if (r.hits >= m.need) modeEnd(true);
  else { sfx.modeHit(); show(sText(m.name, (m.need - r.hits) + ' MORE ' + m.goal, {}), 900, 1); }
}
function modeEnd(done, quiet){
  const r = gm.modeRun; if (!r) return;
  const m = MODES[r.i];
  gm.modeRun = null;
  if (done){
    const v = score(m.done * gm.level);
    gm.b.modes++; gm.modesDone++;
    sfx.modeDone(); flashFx = 0.8; lampShow('sweep', 1600);
    show(sText(m.name + ' COMPLETE', fmt(v), { sparkle: true, flash: true }), 2200, 3);
    gm.ladder++;
    if (gm.modesDone === 3 && gm.extraGiven === 0){ gm.extraLit = true; later(2300, () => show(sText('EXTRA BALL', 'IS LIT AT SCOOP', { flash: true }), 1800, 3)); }
    if (gm.ladder >= MODES.length){
      gm.ladder = 0;
      later(2300, () => {
        const w = score(1000000 * gm.level); gm.level++;
        sfx.superJp(); lampShow('flash', 2500); flashFx = 1;
        show(sText('AURORA COMPLETE', fmt(w), { sparkle: true, inv: true }), 3000, 4);
      });
    }
  } else if (!quiet){ sfx.modeEnd(); show(sText(m.name + ' ENDED', 'COMPLETE BANKS TO RELIGHT', {}), 1600, 2); }
}
function lightMode(){
  if (gm.modeRun || gm.modeLit) return false;
  gm.modeLit = true;
  show(sText('MODE IS LIT', MODES[gm.ladder].name + ' AT SCOOP', { flash: true }), 1600, 2);
  return true;
}
function majorShot(kind, ball){
  const B = gm.b;
  B.shots++;
  const combo = gm.lastShot && gm.lastShot !== kind && clock - gm.lastShotAt < 3500;
  gm.lastShot = kind; gm.lastShotAt = clock;
  score(kind === 'ramp' ? 25000 : 20000);
  if (combo){ score(50000); later(0, () => show(sText('COMBO', '50,000', { flash: true }), 1000, 2)); }
  modeProgress(kind);
  if (gm.mb){
    const v = score(150000 + 50000 * gm.jpCount);
    gm.jpCount++; gm.jackpots++;
    sfx.jackpot(); flashFx = 1; lampShow('flash', 900);
    show(sText('JACKPOT', fmt(v), { inv: true, sparkle: true }), 1800, 4);
    if (gm.jpCount >= 3 && !gm.superLit){ gm.superLit = true; later(1900, () => show(sText('SUPER JACKPOT', 'IS LIT AT SCOOP', { flash: true }), 1600, 3)); }
    return;
  }
  if (gm.lockLit){
    if (!ball){ show(sText('LOCK IS LIT', 'SHOOT RAMP OR ORBIT', {}), 1200, 2); return; }
    gm.locked++;
    sfx.lock(); flashFx = 0.4;
    if (gm.locked >= 2){ show(sText('BALL 2 LOCKED', 'MULTIBALL', { flash: true }), 1400, 3); later(1200, startMultiball); }
    else {
      show(sText('BALL 1 LOCKED', 'SHOOT RAMP OR ORBIT AGAIN', { flash: true }), 1800, 3);
      later(1000, () => { if (state === 'play'){ gm.b.skill = true; serveBall(false); } });
    }
    return 'lock';
  }
  gm.lockWords = Math.min(3, gm.lockWords + 1);
  if (gm.lockWords >= 3){ gm.lockLit = true; sfx.lockLit(); show(sText('LOCK IS LIT', 'SHOOT RAMP OR ORBIT', { border: true }), 1800, 3); }
  else { sfx.word(); show(sText(LOCK_WORDS[gm.lockWords - 1], kind === 'ramp' ? 'RAMP ' + fmt(25000) : 'ORBIT ' + fmt(20000), {}), 1200, 2); }
}
function startMultiball(){
  gm.mb = true; gm.mbCount++; gm.locked = 0; gm.lockLit = false; gm.lockWords = 0; gm.jpCount = 0;
  gm.b.saveUntil = clock + 15000;
  sfx.mball(); flashFx = 1; lampShow('chase', 3000);
  show(sText('MULTIBALL', 'ALL SHOTS LIGHT JACKPOT', { inv: true, border: true, zoom: true }), 2600, 4);
  // the locked balls are fired off the rail one by one, the trough tops up to three
  const held = tb.rail.length;
  railCharge(900);
  for (let i = 1; i < held; i++) later(900 + i * 650, railRelease);
  const need = Math.max(0, 3 - balls.length);
  for (let i = 0; i < need; i++) later(1500 + i * 1300, () => { if (state === 'play') serveBall(true); });
}
function scoopAward(b){
  const B = gm.b;
  score(5000); gm.scoops++;
  const awards = [];
  if (B.skill){ B.skill = false; awards.push(() => { const v = score(50000 * gm.level); sfx.skill(); flashFx = 0.6; show(sText('SKILL SHOT', fmt(v), { sparkle: true, flash: true }), 1700, 4); }); }
  if (gm.mb && gm.superLit){ gm.superLit = false; gm.jpCount = 0; awards.push(() => { const v = score(750000 * gm.mbCount); sfx.superJp(); flashFx = 1; lampShow('flash', 2000); show(sText('SUPER JACKPOT', fmt(v), { inv: true, sparkle: true }), 2400, 4); }); }
  if (gm.extraLit){ gm.extraLit = false; gm.extraGiven++; gm.extraBalls++; awards.push(() => { sfx.extra(); flashFx = 0.6; show(sText('EXTRA BALL', 'SHOOT AGAIN LIT', { flash: true, border: true }), 2000, 4); }); }
  if (gm.modeRun && gm.modeRun.i === 4) awards.push(() => modeProgress('scoop'));
  else if (gm.modeLit && !gm.modeRun) awards.push(modeStart);
  if (!awards.length && gm.scoops % 3 === 0) awards.push(mystery);
  if (!awards.length) awards.push(() => show(sText('SCOOP', fmt(5000 * x3()), {}), 900, 1));
  awards.forEach((f, i) => later(i * 1200, f));
  b.plugin.held.t = Math.max(b.plugin.held.t, 110 + (awards.length - 1) * 145 + (awards.length > 1 || gm.modeRun ? 90 : 0));
  sfx.scoopIn();
}
function mystery(){
  const opts = [
    ['100,000', () => score(100000)],
    ['LIGHT LOCK', () => { gm.lockWords = 3; gm.lockLit = true; }],
    ['BALL SAVE 15S', () => { gm.b.saveUntil = clock + 15000; }],
    ['SUPER POPS', () => { gm.superPopsUntil = clock + 20000; }],
    ['BONUS +1X', () => { gm.b.bonusX = Math.min(6, gm.b.bonusX + 1); }],
    ['MODE IS LIT', () => { if (!lightMode()) score(50000); }],
  ].filter(o => !(gm.mb && o[0] === 'LIGHT LOCK'));
  const o = opts[Math.random() * opts.length | 0];
  o[1](); sfx.shot();
  show(sText('MYSTERY', o[0], { border: true }), 1600, 3);
}
function nudge(){
  if (state !== 'play' || !gm || gm.b.tilted) return;
  const B = gm.b;
  sfx.nudge(); shake = 1;
  balls.forEach(b => {
    if (b.plugin.guide || b.plugin.held || b.plugin.inLane) return;
    Body.setVelocity(b, { x: b.velocity.x + (Math.random() - 0.5) * 1.6, y: b.velocity.y - 2.2 });
  });
  B.bob += 1;
  if (B.bob >= 2.5){
    B.bob = 0; B.warnings++;
    if (B.warnings >= 3) tilt();
    else { sfx.danger(); show(sText(B.warnings === 1 ? 'DANGER' : 'DANGER DANGER', 'TILT WARNING', { flash: true }), 1400, 4); }
  }
}
function tilt(){
  const B = gm.b;
  B.tilted = true; LF.on = RF.on = false;
  if (gm.modeRun) modeEnd(false, true);
  gm.mb = false;
  giTarget = 0.12; sfx.tilt();
  clearScenes(); show(sText('TILT', '', { flash: true }), 60000, 9);
}

// ── switch events from the physics ──────────────────
function onEv(type, d, pos){
  if (!gm || state !== 'play'){ if (type === 'drain') onDrain(pos); else if (type === 'orbitPark' || type === 'rampPark') railArrive(pos); return; }
  const B = gm.b;
  if (B.skill && !['launch', 'plungeExit', 'plungeBack', 'scoop', 'mode', 'drain'].includes(type)) B.skill = false;
  switch (type){
  case 'bumper': {
    const sp = clock < gm.superPopsUntil;
    score(sp ? 5000 : 1000); B.pops++; sfx.bumper(); flashLamp('b' + d, 1);
    modeProgress('bumper'); break;
  }
  case 'sling': score(110); sfx.sling(); flashLamp('sl' + d * 2, 1); flashLamp('sl' + (d * 2 + 1), 1); break;
  case 'target': {
    const t = tb.targets[d]; if (t.plugin.dropped) break;
    // the switch registers now; the target falls a moment later, so the ball
    // still rebounds off its face like a real drop target
    t.plugin.dropped = true; t.plugin.fl = 1; later(25, () => { if (t.plugin.dropped) T.dropTarget(t, true); });
    score(2500); B.targets++; sfx.target(); modeProgress('target');
    const bank = tb.targets.filter(x => x.plugin.bank === t.plugin.bank);
    if (bank.every(x => x.plugin.dropped)){
      const v = score(gm.bankValue); gm.banks++; gm.bankValue += 10000;
      const nm = t.plugin.bank ? 'SYSTEMS BANK' : 'VECTOR BANK';
      lampShow('bank' + t.plugin.bank, 900);
      if (!lightMode()){ gm.superPopsUntil = clock + 20000; sfx.pops(); show(sText(nm, fmt(v) + ' - SUPER POPS', { border: true }), 1500, 2); }
      else show(sText(nm, fmt(v), { border: true }), 900, 2);

// ════════════════════════════════════════════
const STEP = T.STEP_MS;

    const due = timers.filter(t => t.at <= clock); timers = timers.filter(t => t.at > clock);

    due.forEach(t => { try { t.fn(); } catch (e){ console.error(e); } });

  if (Math.abs(tb.plungerHead.position.y - hy) > 0.01) Body.setPosition(tb.plungerHead, { x: PH0.x, y: hy });

  const tilted = !!(gm && gm.b.tilted);
  simOpts.tilted = tilted || state !== 'play';

  for (const b of balls) if (!b.plugin.guide && !b.plugin.held && !b.plugin.inLane) laneSwitches(b);

    const B = gm.b;
    B.bob = Math.max(0, B.bob - STEP / 1000 * 0.9);

    // ball is loose (held in the scoop, parked on the rail, waiting in the lane)
    const loose = balls.some(x => !x.plugin.held && !x.plugin.inLane && !parked(x));
    if (!loose){

}
function drawCaps(){
  tb.bumps.forEach((b, i) => {
    const cp = G.sprites.caps[i], spr = SPR['bump' + i]; if (!ready('bump' + i)) return;
    const fl = b.plugin.fl, down = fl > 0.72 ? 1 : 0;
    const s = PL(cp.r * 2 + 4), c = P(cp.c[0], cp.c[1]);
    const k = 1 - down * 0.025;
    g.drawImage(spr.img, c.x - s * k / 2, c.y - s * k / 2 + down * 1.3, s * k, s * k);
  });
}
// the bat's outline (tapered capsule) at its current angle, grown and offset
function flipPath(f, grow, dx, dy){
  const a = f.restAng + f.body.angle, ux = Math.cos(a), uy = Math.sin(a);
  const px = f.pivX + dx, py = f.y + dy;
  g.beginPath();
  g.arc(px, py, f.r1 + grow, a + Math.PI / 2, a + Math.PI * 1.5);
  g.arc(px + ux * f.len, py + uy * f.len, f.r2 + grow, a - Math.PI / 2, a + Math.PI / 2);
  g.closePath();
}
// Only the cream cap is a photo sprite. The black body under it (with its
// cream band) is extruded straight down the screen and the cast shadow falls
// down-table, so both stay put in the world while the bat swings.
function drawFlipper(f, name){
  const B = G.sprites.flipBody, rim = PL(B.rim), h = PL(B.h), band = PL(B.band);
  const lift = f.body.angle ? 1 : 0;
  g.fillStyle = '#000';
  [[0, 0.26], [1.4, 0.13], [2.8, 0.07]].forEach(([k, al]) => {
    g.globalAlpha = al; flipPath(f, rim + k, PL(6), h + PL(10) + lift); g.fill();
  });
  g.globalAlpha = 1;
  g.fillStyle = '#2b2824'; flipPath(f, rim, 0, h); g.fill();          // rubber edge at the foot
  g.fillStyle = '#131211';
  for (let dy = h - 0.8; dy > band; dy -= 0.9){ flipPath(f, rim, 0, dy); g.fill(); }
  flipPath(f, rim - 0.2, 0, band); g.strokeStyle = 'rgba(222,212,190,0.85)'; g.lineWidth = 0.8; g.stroke();
  for (let dy = band - 0.9; dy > 0; dy -= 0.9){ flipPath(f, rim, 0, dy); g.fill(); }
  flipPath(f, rim, 0, 0); g.fill();
  if (!ready(name)) return;
  const s = G.sprites.flipS * T.IMG_K;
  g.save(); g.translate(f.pivX, f.y); g.rotate(f.body.angle);
  g.drawImage(SPR[name].img, -s / 2, -s / 2, s, s);
  g.restore();
}
function drawPlunger(){
  if (!ready('plunger')) return;
  const r = G.sprites.plunger, p = P(r.x, r.y);
  g.drawImage(SPR.plunger.img, p.x, p.y + plVis * T.PULL_MAX, PL(r.w), PL(r.h));
}
function drawBall(b){
  const pl = b.plugin, R = T.BALL_R;
  let { x, y } = b.position;
  const up = T.raised(b);                                           // on a wire / the clear ramp
  let k = 1 + up * 0.1, sh = 1 + up * 1.8;
  if (pl.held){ k = 0.84; sh = 0; }                                 // sunk in the scoop
  // shadow (key light is above the far end of the table)
  if (sh){
    g.globalAlpha = 0.45; g.fillStyle = '#000';
    g.beginPath(); g.ellipse(x + 0.8 * sh, y + 2.2 * sh, R * 0.95 * k, R * 0.8 * k, 0, 0, TAU); g.fill();
  }
  const v = Math.hypot(b.velocity.x, b.velocity.y);
  if (v > 9 && !pl.guide && !pl.held){                              // a touch of motion blur
    g.globalAlpha = 0.18;
    g.drawImage(ballSpr, x - b.velocity.x * 0.35 - R, y - b.velocity.y * 0.35 - R, R * 2, R * 2);
  }
  g.globalAlpha = 1;
  g.drawImage(ballSpr, x - R * k, y - R * k, R * 2 * k, R * 2 * k);
  if (pl.held){ g.globalAlpha = 0.35; g.fillStyle = '#000'; g.beginPath(); g.arc(x, y, R * k, 0, TAU); g.fill(); g.globalAlpha = 1; }
}

// the rail's magnet: charging ring + arcs around the ball at the dead end,
// then a flash as it fires the ball off the wire
const RAIL_END = P(826, 682);
function drawRailFx(){
  g.globalCompositeOperation = 'lighter';
  if (railFx){
    const e = Math.min(1, Math.max(0, (clock - railFx.t0) / railFx.dur));
    const f = 0.5 + 0.5 * Math.sin(e * e * 46);
    const c = RAIL_END, R = T.BALL_R;
    glowAt({ x: c.x, y: c.y, r: PL(36 + 50 * e), rx: 1, col: COL.cyan }, (0.25 + 0.75 * f) * (0.35 + 0.65 * e));
    g.globalAlpha = 0.35 + 0.6 * e; g.strokeStyle = '#a8e4ff'; g.lineWidth = 0.7 + e;
    g.beginPath(); g.arc(c.x, c.y, R * (2.6 - 1.3 * e), 0, TAU); g.stroke();
    // little arcs jumping from the wire to the ball
    g.lineWidth = 0.6; g.strokeStyle = '#dff4ff';
    for (let i = 0; i < 2 + e * 4; i++){
      const a = Math.random() * TAU, r0 = R * 1.05, r1 = R * (1.6 + Math.random() * 0.8);
      g.globalAlpha = 0.5 + Math.random() * 0.5;
      g.beginPath(); g.moveTo(c.x + Math.cos(a) * r0, c.y + Math.sin(a) * r0);
      const steps = 3;
      for (let k = 1; k <= steps; k++){
        const rr = r0 + (r1 - r0) * k / steps, aa = a + (Math.random() - 0.5) * 0.5;
        g.lineTo(c.x + Math.cos(aa) * rr, c.y + Math.sin(aa) * rr);
      }
      g.stroke();
    }
  }
  railBursts = railBursts.filter(bu => now() - bu.t0 < 480);
  for (const bu of railBursts){
    const e = (now() - bu.t0) / 480;
    glowAt({ x: bu.x, y: bu.y, r: PL(60 + 140 * e), rx: 1, col: [200, 235, 255] }, 1 - e);
    g.globalAlpha = (1 - e) * 0.9; g.strokeStyle = '#e8f7ff'; g.lineWidth = 1.4 * (1 - e) + 0.3;
    g.beginPath(); g.arc(bu.x, bu.y, T.BALL_R * (1.2 + 4 * e), 0, TAU); g.stroke();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

function drawBackbox(t){
  const bg = g.createLinearGradient(0, 0, 0, IMG_Y);
  bg.addColorStop(0, '#141416'); bg.addColorStop(1, '#070708');
  g.fillStyle = bg; g.fillRect(0, 0, W, IMG_Y);
  // brushed metal
  g.fillStyle = 'rgba(255,255,255,0.018)';
  for (let y = 0; y < IMG_Y; y += 3) g.fillRect(0, y, W, 1);
  // title
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#d4aa50'; g.font = '600 13px "Helvetica Neue",Arial,sans-serif';
  g.fillText('A U R O R A', W / 2, 30);
  g.fillStyle = 'rgba(170,150,100,0.7)'; g.font = '7px "Helvetica Neue",Arial,sans-serif';
  g.fillText('I N D U S T R I E S', W / 2, 44);
  // speaker panels + DMD bezel
  const bx = DX - 8, by = DY - 8, bw = DWP + 16, bh = DHP + 16;
  g.fillStyle = '#020202'; g.beginPath(); g.roundRect(bx, by, bw, bh, 6); g.fill();
  g.strokeStyle = 'rgba(212,170,80,0.55)'; g.lineWidth = 1; g.stroke();
  // DMD
  g.fillStyle = '#1a0d05'; g.fillRect(DX, DY, DWP, DHP);
  g.imageSmoothingEnabled = false; g.drawImage(dcv, DX, DY, DWP, DHP); g.imageSmoothingEnabled = true;
  if (dmask) g.drawImage(dmask, DX, DY, DWP, DHP);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.3;
  g.drawImage(dcv, DX - 3, DY - 3, DWP + 6, DHP + 6);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const gl = g.createLinearGradient(DX, DY, DX + DWP, DY + DHP);
  gl.addColorStop(0, 'rgba(255,255,255,0.05)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,0.02)');
  g.fillStyle = gl; g.fillRect(DX, DY, DWP, DHP);
  // speaker grilles
  const sy = DY + DHP + 30;
  [W * 0.2, W * 0.8].forEach(cx => {
    g.fillStyle = '#0b0b0c'; g.beginPath(); g.arc(cx, sy, 22, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(212,170,80,0.35)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.08)';
    for (let yy = -18; yy <= 18; yy += 4) for (let xx = -18; xx <= 18; xx += 4) if (xx * xx + yy * yy < 330){ g.fillRect(cx + xx, sy + yy, 1.4, 1.4); }
  });
  // status line between the speakers
  g.fillStyle = 'rgba(200,180,130,0.85)'; g.font = '600 9px "Helvetica Neue",Arial,sans-serif';
  const credit = 'CREDITS ' + credits + '  ·  FREE PLAY';
  g.fillText(credit, W / 2, sy - 6);
  g.fillStyle = 'rgba(150,134,92,0.7)'; g.font = '8px "Helvetica Neue",Arial,sans-serif';
  g.fillText('HIGH SCORE ' + fmt(hiscores[0].s), W / 2, sy + 8);
  // mute
  g.strokeStyle = muted ? 'rgba(140,120,80,0.5)' : '#d4aa50'; g.fillStyle = g.strokeStyle; g.lineWidth = 1.4;
  const mx = W - 30, my = 26;
  g.beginPath(); g.moveTo(mx - 7, my - 3); g.lineTo(mx - 3, my - 3); g.lineTo(mx + 2, my - 7); g.lineTo(mx + 2, my + 7); g.lineTo(mx - 3, my + 3); g.lineTo(mx - 7, my + 3); g.closePath(); g.fill();
  if (muted){ g.beginPath(); g.moveTo(mx + 5, my - 4); g.lineTo(mx + 12, my + 4); g.moveTo(mx + 12, my - 4); g.lineTo(mx + 5, my + 4); g.stroke(); }
  else { g.beginPath(); g.arc(mx + 3, my, 5, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(mx + 3, my, 9, -0.9, 0.9); g.stroke(); }
  // seam
  g.fillStyle = '#d4aa50'; g.fillRect(0, IMG_Y - 2, W, 1.2);
}
function drawCabinetFront(t){
  const y0 = BAND_Y;
  // lockdown bar
  const lg = g.createLinearGradient(0, y0, 0, y0 + 12);
  lg.addColorStop(0, '#8d8d94'); lg.addColorStop(0.35, '#e2e2e8'); lg.addColorStop(1, '#46464c');
  g.fillStyle = lg; g.fillRect(0, y0, W, 12);
  g.fillStyle = '#0a0a0b'; g.fillRect(0, y0 + 12, W, H - y0 - 12);
  // flipper buttons
  const by = y0 + 42;
  [[26, LF.on], [W - 26, RF.on]].forEach(([x, on]) => {
    g.fillStyle = on ? '#e8c060' : '#6b5526'; g.beginPath(); g.roundRect(x - 9, by - 20, 18, 40, 7); g.fill();
    if (on){ g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5; g.drawImage(glowSprite(COL.gold), x - 24, by - 30, 48, 60); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  });
  // start button
  const pulse = state === 'attract' || state === 'over' ? (Math.sin(t * 0.006) * 0.5 + 0.5) : 0.15;
  g.fillStyle = '#2a2208'; g.beginPath(); g.arc(W / 2, by, 13, 0, TAU); g.fill();
  g.fillStyle = `rgba(232,192,96,${0.35 + pulse * 0.65})`; g.beginPath(); g.arc(W / 2, by, 10, 0, TAU); g.fill();
  g.fillStyle = '#1a1405'; g.font = 'bold 6.5px "Helvetica Neue",Arial,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('START', W / 2, by + 0.5);
  g.fillStyle = 'rgba(170,150,100,0.6)'; g.font = '8px "Helvetica Neue",Arial,sans-serif';
  const hint = state === 'play' ? (plungerReady() ? '右側を長押し / 下へドラッグ → 離して発射' : '中央下を上にスワイプ: ナッジ') :
    state === 'entry' ? '左右: 文字選択  ·  中央: 決定' : 'タップでスタート';
  g.fillText(hint, W / 2, by + 22);          // clear of the iPhone home indicator
}
function drawAttractCard(t){
  // instruction card over the lower playfield while the game is idle
  const a = Math.min(1, (now() - attractT0) / 600);
  const x = 34, y = 440, w = W - 68, h = 218;
  g.globalAlpha = 0.86 * a; g.fillStyle = '#0b0a08'; g.beginPath(); g.roundRect(x, y, w, h, 10); g.fill();
  g.globalAlpha = a; g.strokeStyle = 'rgba(212,170,80,0.7)'; g.lineWidth = 1; g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#e0bb62'; g.font = '600 13px "Helvetica Neue",Arial,sans-serif'; g.fillText('HOW TO PLAY', W / 2, y + 20);
  const rows = [
    ['画面の左 / 右をタップ', 'フリッパー'],
    ['右側を長押し or 下へドラッグ', 'プランジャー'],
    ['中央下を上にスワイプ', 'ナッジ（やりすぎるとTILT）'],
    ['弱めに打ってスクープへ', 'スキルショット'],
    ['ORBIT/LIGHT/LOCK点灯 → ロック×2', 'マルチボール'],
    ['ドロップターゲット全消し', 'モード点灯 → スクープで開始'],
    ['左右インレーン両方点灯', 'ボーナス倍率アップ'],
  ];
  rows.forEach(([l, r], i) => {
    const yy = y + 46 + i * 24;
    g.textAlign = 'left'; g.fillStyle = 'rgba(235,225,200,0.92)'; g.font = '11px "Helvetica Neue",Arial,sans-serif'; g.fillText(l, x + 14, yy);
    g.textAlign = 'right'; g.fillStyle = 'rgba(212,170,80,0.95)'; g.font = '600 10px "Helvetica Neue",Arial,sans-serif'; g.fillText(r, x + w - 14, yy);
  });
  if (blink(t, 600)){ g.textAlign = 'center'; g.fillStyle = '#f0cf78'; g.font = '600 13px "Helvetica Neue",Arial,sans-serif'; g.fillText('TAP TO START', W / 2, y + h + 22); }
  g.globalAlpha = 1;
}

function draw(t, dt){
  g.setTransform(SC, 0, 0, SC, 0, 0);
  g.fillStyle = '#050505'; g.fillRect(0, 0, W, H);
  drawBackbox(t);
  g.save();
  if (shake > 0){ g.translate((Math.random() - 0.5) * 4 * shake, -3 * shake); shake = Math.max(0, shake - dt / 140); }
  // playfield photo + GI
  if (ready('board')) g.drawImage(SPR.board.img, 0, IMG_Y, W, IMG_H);
  gi += (giTarget - gi) * Math.min(1, dt / 180);
  drawLampsDark();
  drawTargets();
  if (gi < 0.99){ g.globalAlpha = (1 - gi) * 0.72; g.fillStyle = '#000'; g.fillRect(0, IMG_Y, W, IMG_H); g.globalAlpha = 1; }
  // lamp glows
  g.globalCompositeOperation = 'lighter';
  for (const id of LAMP_IDS){ const L = LAMP[id]; glowAt(L, L.lv * (id === 'logo' ? 0.5 : id[0] === 'b' ? 0.55 : 0.9)); }
  tb.targets.forEach(tg => { if (tg.plugin.fl > 0) glowAt({ x: tg.position.x, y: tg.position.y, r: PL(50), rx: 1, col: COL.gold }, tg.plugin.fl); });
  tb.bumps.forEach((b, i) => { if (b.plugin.fl > 0) glowAt(LAMP['b' + i], b.plugin.fl); });
  tb.slings.forEach((s, i) => { if (s.plugin.fl > 0){ glowAt(LAMP['sl' + i * 2], s.plugin.fl); glowAt(LAMP['sl' + (i * 2 + 1)], s.plugin.fl); } });
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  // moving parts
  drawCaps();
  drawPlunger();
  drawFlipper(LF, 'flipperL'); drawFlipper(RF, 'flipperR');
  // balls on the playfield / in the channels first, then the clear plastic
  // they pass beneath, then balls riding up on wires and the ramp
  balls.forEach(b => { if (!T.raised(b)) drawBall(b); });
  if (ready('rampcap')){ const rc = G.sprites.rampCap, p = P(rc.x, rc.y); g.drawImage(SPR.rampcap.img, p.x, p.y, PL(rc.w), PL(rc.h)); }
  balls.forEach(b => { if (T.raised(b)) drawBall(b); });
  drawRailFx();
  if (flashFx > 0){
    // flashers light the playfield, not the cabinet walls
    g.globalCompositeOperation = 'lighter';
    glowAt({ x: T.PCX, y: IMG_Y + IMG_H * 0.42, r: IMG_H * 0.5, rx: 0.62, col: [255, 226, 170] }, flashFx * 0.55);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; flashFx = Math.max(0, flashFx - dt / 350);
  }
  g.restore();
  drawCabinetFront(t);
  if (state === 'attract') drawAttractCard(t);
}

// ── base DMD screens ───────────────────────────────
function dmdBase(t){
  if ((state === 'play' || state === 'bonus') && gm){
    const B = gm.b;
    const s = fmt(gm.score), sc = fitScale(s, 2);
    dText(s, 64, sc === 2 ? 3 : 6, sc, 15, 'c');
    dText('BALL ' + gm.ball, 1, 25, 1, 7);
    let info = '';
    if (plungerReady() && B.skill) info = blink(t, 500) ? 'SKILL SHOT' : 'PLUNGE';
    else if (gm.modeRun){ const m = MODES[gm.modeRun.i]; info = m.name + ' ' + Math.max(0, Math.ceil((gm.modeRun.end - clock) / 1000)); }
    else if (gm.mb) info = gm.superLit ? 'SUPER JACKPOT LIT' : 'JACKPOT LIT';
    else if (gm.lockLit) info = 'LOCK LIT';
    else if (gm.modeLit) info = 'MODE LIT';
    else if (B.bonusX > 1) info = 'BONUS ' + B.bonusX + 'X';
    dText(info, 127, 25, 1, 7, 'r');
    if (x3() > 1 && blink(t, 400)) dText('3X', 64, 25, 1, 15, 'c');
    return;
  }
  if (state === 'entry' && entry){
    dText('INITIALS', 64, 1, 1, 8, 'c');
    for (let i = 0; i < 3; i++){
      const ch = i < entry.pos || i === entry.pos ? entry.chars[entry.letters[i]] : '_';
      const vis = i !== entry.pos || blink(t, 180);
      if (vis) dText(ch === ' ' ? '_' : ch, 40 + i * 24, 10, 2, i === entry.pos ? 15 : 9, 'c');
    }
    dText(fmt(lastScore), 64, 26, 1, 6, 'c');
    return;
  }
  // attract cycle
  const pages = 5, e = (t - attractT0) % (pages * 3200), p = e / 3200 | 0, pe = e % 3200;
  if (p === 0){ dLogo(20, 16, 1.6, 15); dText('AURORA', 76, 5, 2, 15, 'c'); dText('INDUSTRIES', 76, 22, 1, 8, 'c'); }
  else if (p === 1){ if (blink(pe, 400)) dText('PRESS START', 64, 5, 2, 15, 'c'); dText('TAP THE TABLE', 64, 23, 1, 8, 'c'); }
  else if (p === 2){
    dText('HIGH SCORES', 64, 0, 1, 12, 'c');
    hiscores.slice(0, 3).forEach((h, i) => { dText((i + 1) + '. ' + h.n, 4, 9 + i * 8, 1, 10); dText(fmt(h.s), 124, 9 + i * 8, 1, 10, 'r'); });
  }
  else if (p === 3){
    if (lastScore) { dText('LAST GAME', 64, 3, 1, 8, 'c'); dText(fmt(lastScore), 64, 13, fitScale(fmt(lastScore), 2), 15, 'c'); }
    else { dText('REPLAY AT', 64, 3, 1, 8, 'c'); dText(fmt(REPLAY_AT), 64, 13, 2, 15, 'c'); }
  }
  else sScroll('ORBIT SHOTS LIGHT LOCK - COMPLETE BANKS TO LIGHT MODES - 3X SCORING AT ELEVATE -', 0.07)(pe);
}
function dmdUpdate(t){
  if (scene && t - scene.t0 > scene.dur){ scene = sceneQ.shift() || null; if (scene) scene.t0 = t; }
  while (scene && scene.pri === 1 && sceneQ.length && sceneQ[0].pri > 1){ scene = sceneQ.shift(); scene.t0 = t; }
  dClear();
  if (scene) scene.fn(t - scene.t0, scene.dur); else dmdBase(t);
  dmdBlit();
}

// ════════════════════════════════════════════
// MAIN LOOP (fixed timestep accumulator)
// ════════════════════════════════════════════
let last = 0, acc = 0;
function frame(ts){
  const dt = Math.min(ts - last, 50) || 16.7;
  last = ts; acc += dt;
  holdCharge();
  if (kbPull) pull = Math.min(1, (now() - kbPull) / 1400);
  let n = 0;
  while (acc >= STEP && n < 10){ physStep(); acc -= STEP; n++; }
  if (n === 10) acc = 0;
  updateLamps(ts, dt);
  dmdUpdate(ts);
  rollUpdate();
  draw(ts, dt);
}
function loop(ts){
  try { frame(ts); } catch (e){ console.error(e); }
  requestAnimationFrame(loop);
}
resize();
buildBall();
window.addEventListener('resize', resize);
attractT0 = now();
if (!globalThis.__HEADLESS) requestAnimationFrame(ts => { last = ts; requestAnimationFrame(loop); });

// headless test API (harmless in production)
globalThis.__pin = {
  T, tb, get balls(){ return balls; }, get gm(){ return gm; }, get state(){ return state; }, get clock(){ return clock; },
  frame, physStep, startGame, onEv, pDown, pMove, pUp, flip, nudge, launch, laneBall, LAMP, get scene(){ return scene; },
  dbuf,
};
