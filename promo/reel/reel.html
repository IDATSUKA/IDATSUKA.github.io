<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Motion Reel</title>
<!-- 15.000s motion reel. Every frame is a pure function of time: window.__R.seek(t). -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#060607; --fg:#f4f5f7; --ice:#9fd6ec; --sig:#ff5a36; --muted:#70767f; --dim:#5c626b;
  --display:'Archivo',sans-serif; --grot:'Space Grotesk',sans-serif; --mono:'Space Mono',monospace;
  --jp:'Zen Kaku Gothic New',sans-serif;
}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--fg)}
#world{position:absolute;inset:0;transform-origin:960px 540px}
canvas{position:absolute;left:0;top:0}
.layer{position:absolute;inset:0;pointer-events:none}
.mono{font-family:var(--mono);text-transform:uppercase}
.jp{font-family:var(--jp)}

/* 02 TYPE */
#inv{background:var(--fg)}
.mask{position:absolute;left:0;width:1920px;overflow:hidden}
.word{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;
  font-family:var(--display);font-size:250px;line-height:1;letter-spacing:-.01em}
.word span{display:inline-block;will-change:transform}
#sub1{position:absolute;left:0;width:1920px;top:640px;text-align:center;font-size:30px;font-weight:500;
  letter-spacing:.08em;color:#c3c8d0}
#tread{position:absolute;font-size:14px;letter-spacing:.18em;color:var(--ice)}

/* 03 FORM */
#formL{position:absolute;left:140px;top:420px;width:620px}
#shapeName{height:78px;overflow:hidden;position:relative}
#shapeName div{position:absolute;left:0;top:0;font-family:var(--display);font-weight:900;font-size:78px;line-height:78px;
  font-variation-settings:"wdth" 62;letter-spacing:.01em}
#formula{margin-top:22px;font-size:17px;letter-spacing:.06em;color:#c3c8d0;text-transform:none;white-space:nowrap}
#formMeta{margin-top:12px;font-size:14px;letter-spacing:.2em;color:var(--ice)}
#formR{position:absolute;right:140px;top:420px;text-align:right;font-size:14px;letter-spacing:.22em;line-height:34px;color:var(--dim)}
#formR .on{color:var(--fg)}
#formR .on::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sig);margin-right:14px;vertical-align:1px}

/* 04 FLOW */
#flowCap{position:absolute;left:140px;top:830px;font-size:15px;letter-spacing:.18em;color:var(--ice);text-transform:none}

/* 05 SYSTEM */
#statLbl{position:absolute;left:140px;top:352px;height:24px;overflow:hidden;width:700px}
#statLbl div{position:absolute;left:0;top:0;font-size:18px;letter-spacing:.3em;color:var(--ice);white-space:nowrap}
#statLbl .jp{font-size:18px;letter-spacing:.12em;color:#c3c8d0;margin-left:18px;text-transform:none}
#statNum{position:absolute;left:128px;top:390px;height:250px;display:flex}
.slot{width:150px;height:250px;overflow:hidden;position:relative}
.slot.pt{width:70px}
.slot div{position:absolute;left:0;top:0;width:100%;font-family:var(--grot);font-weight:600;font-size:250px;line-height:250px;letter-spacing:-.02em}
#statFoot{position:absolute;left:140px;top:676px;font-size:13px;letter-spacing:.3em;color:var(--dim)}
#statBar{position:absolute;left:140px;top:716px;width:640px;height:2px;background:rgba(255,255,255,.08)}
#statBar i{position:absolute;left:0;top:0;height:2px;background:var(--ice)}

/* 06 STATEMENT */
#s5bg{position:absolute;inset:0}
.big{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:260px;line-height:1;white-space:nowrap;letter-spacing:-.005em}
.big span{display:inline-block}
.chip{position:absolute;font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.06em;color:#060607;white-space:nowrap;text-transform:none}

/* END */
#endWrap{position:absolute;left:0;top:0;width:1920px;height:1080px}
#endMask{position:absolute;left:0;top:340px;width:1920px;height:252px;overflow:hidden}
#endWord{position:absolute;left:0;top:0;width:1920px;text-align:center;font-family:var(--grot);font-weight:500;font-size:236px;
  line-height:252px;letter-spacing:-.035em;white-space:nowrap}
#endWord span{display:inline-block}
#e1{position:absolute;left:0;width:1920px;top:652px;text-align:center;font-size:17px;letter-spacing:.5em;color:var(--ice)}
#e2{position:absolute;left:0;width:1920px;top:698px;text-align:center;font-size:34px;font-weight:500;letter-spacing:.14em}
#e2 span{display:inline-block}
#e3{position:absolute;left:0;width:1920px;top:778px;text-align:center;font-size:14px;letter-spacing:.34em;color:#8a9099}

/* chrome */
#flash{background:#fff;opacity:0}
#grain{opacity:.05;mix-blend-mode:screen}
#vig{background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#hud{color:var(--hudc,#c3c8d0);font-family:var(--mono);font-size:15px;letter-spacing:.24em;text-transform:uppercase}
#hud .c{position:absolute;width:26px;height:26px;border-color:var(--hudc,#c3c8d0);border-style:solid;border-width:0;opacity:.7}
#hud .tl{left:44px;top:44px;border-left-width:1px;border-top-width:1px}
#hud .tr{right:44px;top:44px;border-right-width:1px;border-top-width:1px}
#hud .bl{left:44px;bottom:44px;border-left-width:1px;border-bottom-width:1px}
#hud .br{right:44px;bottom:44px;border-right-width:1px;border-bottom-width:1px}
#hud .t{position:absolute;white-space:nowrap}
#hTL{left:88px;top:52px}
#hTR{right:88px;top:52px}
#hBL{left:88px;bottom:52px;height:18px;overflow:hidden;width:520px}
#hBL div{position:absolute;left:0;top:0}
#hBL .jp{letter-spacing:.1em;margin-left:10px;font-size:13px}
#hBR{right:88px;bottom:52px}
#hBar{position:absolute;left:720px;bottom:58px;width:480px;height:1px;background:rgba(195,200,208,.18)}
#hBar i{position:absolute;left:0;top:0;height:1px;background:var(--hudc,#c3c8d0)}
#hBar b{position:absolute;top:-3px;width:1px;height:7px;background:rgba(195,200,208,.45)}
#hBar em{position:absolute;top:-3px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--sig)}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="inv" class="layer"></div>
    <canvas id="cv" width="1920" height="1080"></canvas>

    <div id="L1" class="layer">
      <div id="words"></div>
      <div id="sub1" class="jp"></div>
      <div id="tread" class="mono"></div>
    </div>

    <div id="L2" class="layer">
      <div id="formL">
        <div id="shapeName"><div id="sn0"></div><div id="sn1"></div></div>
        <div id="formula" class="mono"></div>
        <div id="formMeta" class="mono"></div>
      </div>
      <div id="formR" class="mono"></div>
    </div>

    <div id="L3" class="layer"><div id="flowCap" class="mono"></div></div>

    <div id="L4" class="layer">
      <div id="statLbl"><div id="sl0"></div><div id="sl1"></div></div>
      <div id="statNum"></div>
      <div id="statFoot" class="mono"></div>
      <div id="statBar"><i></i></div>
    </div>

    <div id="L5" class="layer">
      <div id="s5bg"></div>
      <div id="s5a"></div>
      <div id="s5b" class="big"></div>
      <div id="s5c" class="big"></div>
      <div id="chips"></div>
    </div>

    <div id="L6" class="layer">
      <div id="endWrap">
        <div id="endMask"><div id="endWord"></div></div>
        <div id="e1" class="mono">Motion Reel — 2026</div>
        <div id="e2" class="jp"></div>
        <div id="e3" class="mono">Every frame rendered from code · 1920×1080 · 60 fps · 0 keyframes</div>
      </div>
    </div>
  </div>

  <div id="flash" class="layer"></div>
  <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="vig" class="layer"></div>
  <div id="hud" class="layer">
    <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
    <div id="hTL" class="t">Claude — Motion Reel</div>
    <div id="hTR" class="t"></div>
    <div id="hBL" class="t"><div id="hb0"></div><div id="hb1"></div></div>
    <div id="hBR" class="t">1920×1080 · 60 fps · f(t)</div>
    <div id="hBar"><i></i></div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1920, H = 1080, CX = 960, CY = 540;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = n => { const r = rng(n * 9973 + 17); return r(); };

// ---------- palette ----------
const ICE = [159, 214, 236], SIG = [255, 90, 54], FG = [244, 245, 247], BG = [6, 6, 7];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------- timeline (beats at 120 bpm) ----------
const HITS = [1.5, 2.75, 4.0, 6.5, 9.0, 11.5, 12.0, 12.5, 13.05];
const SECTIONS = [
  [0.0, '01 / 06 — Origin', '起点'],
  [1.5, '02 / 06 — Type', '文字'],
  [4.0, '03 / 06 — Form', '形'],
  [6.5, '04 / 06 — Flow', '流れ'],
  [9.0, '05 / 06 — System', '体系'],
  [11.5, '06 / 06 — Statement', '結論'],
];

// ---------- perlin ----------
const PERM = new Uint8Array(512);
{ const r = rng(7), p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function noise(x, y, z) {
  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
  const u = fade(x), v = fade(y), w = fade(z), P = PERM;
  const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(P[AA], x, y, z), grad(P[BA], x - 1, y, z), u), lerp(grad(P[AB], x, y - 1, z), grad(P[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(P[AA + 1], x, y, z - 1), grad(P[BA + 1], x - 1, y, z - 1), u), lerp(grad(P[AB + 1], x, y - 1, z - 1), grad(P[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// ---------- canvas ----------
const cv = $('cv'), g = cv.getContext('2d');

function dot(x, y, r, sx = 1, sy = 1, glow = 1) {
  if (glow > 0) {
    const R = r * 7;
    const gr = g.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, rgba(SIG, .38 * glow)); gr.addColorStop(.35, rgba(SIG, .10 * glow)); gr.addColorStop(1, rgba(SIG, 0));
    g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2);
  }
  g.fillStyle = rgba(SIG, 1);
  g.beginPath(); g.ellipse(x, y, Math.max(.01, r * sx), Math.max(.01, r * sy), 0, 0, TAU); g.fill();
}
const beatPulse = t => 1 + .07 * Math.pow(.5 + .5 * Math.cos(TAU * t * 2), 6);

// =====================================================================
// 3D FORMS
// =====================================================================
const N = 5832; // 18^3
const SH = [new Float32Array(N * 3), new Float32Array(N * 3), new Float32Array(N * 3), new Float32Array(N * 3)];
const EQ = new Float32Array(N * 3);
const PR = new Float32Array(N); // per-point random
{
  const r = rng(42);
  for (let i = 0; i < N; i++) PR[i] = r();
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    // sphere (fibonacci)
    const y = 1 - (i + .5) / N * 2, rr = Math.sqrt(1 - y * y), th = ga * i;
    SH[0].set([Math.cos(th) * rr, y, Math.sin(th) * rr], i * 3);
    EQ.set([Math.cos(th), 0, Math.sin(th)], i * 3);
    // torus 81 x 72
    const a = Math.floor(i / 72), b = i % 72, u = TAU * a / 81, v = TAU * b / 72, R = .78, rt = .3;
    SH[1].set([(R + rt * Math.cos(v)) * Math.cos(u), rt * Math.sin(v), (R + rt * Math.cos(v)) * Math.sin(u)], i * 3);
    // lattice 18^3
    const gi = i % 18, gj = Math.floor(i / 18) % 18, gk = Math.floor(i / 324);
    SH[2].set([(gi / 17 - .5) * 1.34, (gj / 17 - .5) * 1.34, (gk / 17 - .5) * 1.34], i * 3);
    // double helix + rungs
    const k = i / N;
    if (PR[i] < .86) {
      const s = i & 1, yy = (k * 2 - 1) * 1.15, ang = yy * 5.4 + s * Math.PI, jt = (r() - .5) * .07;
      SH[3].set([Math.cos(ang) * (.5 + jt), yy + (r() - .5) * .02, Math.sin(ang) * (.5 + jt)], i * 3);
    } else {
      const rung = Math.floor(r() * 44), yy = (rung / 43 * 2 - 1) * 1.15, ang = yy * 5.4, l = r() * 2 - 1;
      SH[3].set([Math.cos(ang) * .5 * l, yy, Math.sin(ang) * .5 * l], i * 3);
    }
  }
}
const MORPHS = [{ s: 1, t: 4.95 }, { s: 3, t: 5.75 }];
const FORM_INFO = [
  ['SPHERE', 'p = (cos φ · sin θ,  cos θ,  sin φ · sin θ)'],
  ['TORUS', 'p = ((R + r cos v) cos u,  r sin v,  …)'],
  ['LATTICE', 'p = (i, j, k) / 17 − ½'],
  ['HELIX', 'p = (cos 5.4y,  y,  sin 5.4y)'],
];
const P3 = new Float32Array(N * 3), PS = new Float32Array(N * 3); // world, screen(x,y,persp)

function formRot(t) {
  let yaw = t * .75, pitch = .42 + .12 * Math.sin(t * 1.3);
  for (const m of MORPHS) yaw += 1.35 * E.outExpo(seg(t, m.t, m.t + 1.1));
  return [yaw, pitch];
}
function computeForm(t) {
  const [yaw, pitch] = formRot(t), cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const D = 3.3, S = 330 * (1 + .04 * E.outExpo(seg(t, 4.0, 6.5)));
  for (let i = 0; i < N; i++) {
    const o = i * 3;
    const d0 = (SH[0][o + 1] + 1) * .5 * .22;
    const w0 = E.outExpo(seg(t, 4.1 + d0, 4.62 + d0));
    let x = lerp(EQ[o], SH[0][o], w0), y = lerp(EQ[o + 1], SH[0][o + 1], w0), z = lerp(EQ[o + 2], SH[0][o + 2], w0);
    let prev = 0;
    for (const m of MORPHS) {
      const src = SH[prev], dl = ((src[o + 1] + 1.2) / 2.4) * .14 + PR[i] * .04;
      const w = E.inOutExpo(seg(t, m.t - .06 + dl, m.t + .34 + dl));
      if (w > 0) { const d = SH[m.s]; x = lerp(x, d[o], w); y = lerp(y, d[o + 1], w); z = lerp(z, d[o + 2], w); }
      prev = m.s;
    }
    P3[o] = x; P3[o + 1] = y; P3[o + 2] = z;
    const X = x * cy + z * sy, Z = -x * sy + z * cy;
    const Y2 = y * cp - Z * sp, Z2 = y * sp + Z * cp;
    const pz = D / (D + Z2);
    PS[o] = CX + X * pz * S; PS[o + 1] = CY - Y2 * pz * S; PS[o + 2] = pz;
  }
}

// =====================================================================
// FLOW (precomputed curl-noise advection, deterministic)
// =====================================================================
const FT0 = 6.5, FT1 = 9.0, FS = 240, FSTEPS = Math.round((FT1 - FT0) * FS);
let FLOW = null, TGT = null;
function curl(x, y, t, out) {
  const s = .0021, e = .015, nx = x * s, ny = y * s, nz = t * .35;
  const dy = (noise(nx, ny + e, nz) - noise(nx, ny - e, nz)) / (2 * e);
  const dx = (noise(nx + e, ny, nz) - noise(nx - e, ny, nz)) / (2 * e);
  out[0] = dy; out[1] = -dx;
}
function buildFlow() {
  computeForm(FT0);
  FLOW = new Float32Array((FSTEPS + 1) * N * 2);
  const vx0 = new Float32Array(N), vy0 = new Float32Array(N), px = new Float32Array(N), py = new Float32Array(N);
  const r = rng(99), c = [0, 0];
  for (let i = 0; i < N; i++) {
    px[i] = PS[i * 3]; py[i] = PS[i * 3 + 1];
    let dx = px[i] - CX, dy = py[i] - CY; const l = Math.hypot(dx, dy) || 1;
    const a = Math.atan2(dy, dx) + (r() - .5) * .9, m = 700 + Math.pow(r(), 1.6) * 2300;
    vx0[i] = Math.cos(a) * m; vy0[i] = Math.sin(a) * m;
  }
  const dt = 1 / FS;
  for (let k = 0; k <= FSTEPS; k++) {
    const base = k * N * 2, t = FT0 + k * dt, damp = Math.exp(-(t - FT0) * 3.4), spd = 330 * E.outCubic(seg(t, FT0, FT0 + .6));
    for (let i = 0; i < N; i++) {
      FLOW[base + i * 2] = px[i]; FLOW[base + i * 2 + 1] = py[i];
      curl(px[i], py[i], t, c);
      let vx = vx0[i] * damp + c[0] * spd, vy = vy0[i] * damp + c[1] * spd;
      const ox = Math.max(0, Math.abs(px[i] - CX) - 860), oy = Math.max(0, Math.abs(py[i] - CY) - 470);
      vx -= Math.sign(px[i] - CX) * ox * 6; vy -= Math.sign(py[i] - CY) * oy * 6;
      px[i] += vx * dt; py[i] += vy * dt;
    }
  }
}
function flowAt(i, t, out) {
  const f = clamp((t - FT0) * FS, 0, FSTEPS), k = Math.floor(f), a = f - k, k2 = Math.min(FSTEPS, k + 1);
  const o1 = k * N * 2 + i * 2, o2 = k2 * N * 2 + i * 2;
  out[0] = lerp(FLOW[o1], FLOW[o2], a); out[1] = lerp(FLOW[o1 + 1], FLOW[o2 + 1], a);
}
function buildTargets() {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'alphabetic';
  o.font = '700 560px "Space Grotesk"';
  o.fillText('f(t)', CX, 735);
  const d = o.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4] > 128) pts.push(x, y);
  const r = rng(5); TGT = new Float32Array(N * 2);
  const M = pts.length / 2;
  for (let i = 0; i < N; i++) { const j = Math.floor(r() * M); TGT[i * 2] = pts[j * 2] + (r() - .5) * 2; TGT[i * 2 + 1] = pts[j * 2 + 1] + (r() - .5) * 2; }
}
const fa = [0, 0];
function flowPos(i, t, out) {
  flowAt(i, t, out);
  const d = PR[i] * .32, w = E.inOutCubic(seg(t, 7.8 + d, 8.5 + d));
  if (w > 0) {
    const jx = Math.sin(t * 7 + i) * 1.2 * (1 - w * .6), jy = Math.cos(t * 6 + i * 1.7) * 1.2 * (1 - w * .6);
    out[0] = lerp(out[0], TGT[i * 2] + jx, w); out[1] = lerp(out[1], TGT[i * 2 + 1] + jy, w);
  }
  return w;
}

// =====================================================================
// DOM builders
// =====================================================================
const WORDS = [
  { s: 'EVERY', a: 1.56, b: 2.0 },
  { s: 'FRAME', a: 2.0, b: 2.5 },

    if (C) {
      const el = $('s5c'); el.style.color = '#060607';
      const k = E.outExpo(seg(t, 12.5, 12.85));
      el.style.fontVariationSettings = `"wdth" ${lerp(62, 96, k).toFixed(1)}, "wght" ${lerp(500, 900, k).toFixed(0)}`;
      el.style.letterSpacing = `${lerp(.25, -.01, k).toFixed(3)}em`;
      [...el.children].forEach((s, i) => { s.style.transform = ''; });
      // collapse into the dot
      const col = E.inOutExpo(seg(t, 12.78, 13.08));
      const R = lerp(1200, 9, col);
      $('L5').style.clipPath = col > 0 ? `circle(${R.toFixed(1)}px at 960px 540px)` : 'none';
      el.style.transform = `scale(${lerp(1, .02, col)})`;
      chipEls.forEach((c, i) => {
        const a = (i / CHIPS.length + hash(i + 3) * .05) * TAU, r0 = 170 + hash(i + 11) * 60, kk = E.outExpo(seg(t, 12.52 + i * .012, 12.95));
        const r = r0 + kk * (140 + hash(i + 23) * 120);
        c.style.left = (CX + Math.cos(a) * r * 1.95 - 90) + 'px'; c.style.top = (CY + Math.sin(a) * r * 1.2 - 12) + 'px';
        c.style.opacity = (seg(t, 12.52 + i * .012, 12.6 + i * .012) * .85).toFixed(2);
        c.style.transform = `scale(${1 - col})`;
      });
    } else $('L5').style.clipPath = 'none';
    dotOn = false;
  } else $('L5').style.clipPath = 'none';

  // ---------------- END ----------------
  const in6 = t >= 13.0;
  show($('L6'), in6);
  if (t >= 13.08 && t < 15.0) {
    const ww = $('endWord'), sp6 = [...ww.children].filter(e => e.tagName === 'SPAN');
    sp6.forEach((s, i) => {
      const k = E.outExpo(seg(t, 13.12 + i * .045, 13.12 + i * .045 + .5));
      const ko = E.inExpo(seg(t, 14.3 + i * .025, 14.3 + i * .025 + .26));
      s.style.transform = `translateY(${(1 - k) * 105 + ko * 105}%)`;
    });
    ww.style.textShadow = shadow;
    // period position: right after 'e', on baseline
    const lr = sp6[sp6.length - 1].getBoundingClientRect();
    const wr = $('world').getBoundingClientRect();
    const sc = wr.width / W;
    const blr = $('bl6').getBoundingClientRect();
    const px = (lr.right - wr.left) / sc + 22, py = (blr.bottom - wr.top) / sc - 12;
    const go = E.inOutExpo(seg(t, 13.12, 13.52)), back = E.inOutExpo(seg(t, 14.42, 14.86));
    dotOn = true;
    dotX = lerp(lerp(CX, px, go), CX, back);
    dotY = lerp(lerp(CY, py, go), CY, back) - Math.sin(go * Math.PI) * 140 * (1 - back) - Math.sin(back * Math.PI) * 90;
    const land = seg(t, 13.52, 13.62);
    if (land > 0 && land < 1) { const q = Math.sin(land * Math.PI) * .45; dsx = 1 + q; dsy = 1 - q; }
    const lineIn = (at, dur = .5) => E.outExpo(seg(t, at, at + dur));
    const lineOut = (at) => E.inExpo(seg(t, at, at + .2));
    const e1 = $('e1'), e3 = $('e3');
    const k1 = lineIn(13.5, .6), o1 = lineOut(14.22);
    e1.style.opacity = k1 * (1 - o1); e1.style.letterSpacing = `${lerp(1.2, .5, k1).toFixed(3)}em`; e1.style.transform = `translateY(${o1 * 20}px)`;
    [...$('e2').children].forEach((s, i) => {
      const k = lineIn(13.6 + i * .03, .45), o = lineOut(14.24 + i * .01);
      s.style.opacity = k * (1 - o); s.style.transform = `translateY(${(1 - k) * 24 + o * 20}px)`;
    });
    const k3 = lineIn(13.85, .5), o3 = lineOut(14.26);
    e3.style.opacity = k3 * (1 - o3); e3.style.transform = `translateY(${(1 - k3) * 10 + o3 * 20}px)`;
  } else if (t >= 13.0) {
    [...$('endWord').querySelectorAll('span')].forEach(s => s.style.transform = 'translateY(105%)');
    ['e1', 'e3'].forEach(id => $(id).style.opacity = 0);
    [...$('e2').children].forEach(s => s.style.opacity = 0);
    dotOn = t >= 13.06;
  }

  // ---------------- dot ----------------
  if (dotOn) dot(dotX, dotY, dotR, dsx, dsy, 1);

  // ---------------- HUD ----------------
  const hudA = E.outCubic(seg(t, .12, .55)) * (1 - E.inCubic(seg(t, 14.4, 14.85)));
  const hud = $('hud');
  hud.style.opacity = hudA.toFixed(3);
  const lightBg = (t >= 2.78 && t < 3.24) || (t >= 12.0 && t < 12.5) || (t >= 12.5 && t < 12.9);
  hud.style.setProperty('--hudc', lightBg ? '#060607' : '#c3c8d0');
  $('vig').style.opacity = lightBg ? .18 : 1;
  $('hTR').textContent = tc(t);
  rollPair(t, SECTIONS.map(s => s[0]), i => `${SECTIONS[i][1]}<span class="jp">${SECTIONS[i][2]}</span>`, $('hb0'), $('hb1'), .3);
  $('hBar').firstElementChild.style.width = (t / 15 * 480).toFixed(2) + 'px';
  hBarDot.style.left = (t / 15 * 480).toFixed(2) + 'px';

  // grain
  const gf = Math.floor(t * 60) % grainFrames.length;
  if (gf !== lastGrain) { $('grain').getContext('2d').putImageData(grainFrames[gf], 0, 0); lastGrain = gf; }
}

const ready = (async () => {
  await document.fonts.ready;
  await Promise.all([
    document.fonts.load('900 250px Archivo'), document.fonts.load('700 560px "Space Grotesk"'),
    document.fonts.load('500 236px "Space Grotesk"'), document.fonts.load('600 250px "Space Grotesk"'),
    document.fonts.load('400 14px "Space Mono"'), document.fonts.load('500 30px "Zen Kaku Gothic New"', SUB1 + E2),
  ]);
  buildTargets();
  buildFlow();
  seek(0);
  return true;
})();
window.__R = { seek, ready, duration: 15 };

// live preview when opened directly (?play)
if (location.search.includes('play')) {
  ready.then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % 15); requestAnimationFrame(loop); }; loop(); });
} else {
  const m = location.search.match(/t=([\d.]+)/); if (m) ready.then(() => seek(parseFloat(m[1])));
}
})();
</script>
