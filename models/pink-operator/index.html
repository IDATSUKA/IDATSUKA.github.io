<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Operator — 3D Viewer | IDATSUKA</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f2f4; font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; color: #222; }
  #app { position: fixed; inset: 0; }
  .hud { position: fixed; left: 16px; top: 16px; background: rgba(255,255,255,.85); backdrop-filter: blur(6px); padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; max-width: 280px; }
  .hud h1 { font-size: 15px; margin: 0 0 4px; }
  .hud a { color: #d6669e; }
  .hud button { margin-top: 6px; margin-right: 6px; border: 1px solid #f4a3c7; background: #fff; color: #333; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .hud button.on { background: #f4a3c7; color: #fff; }
  #status { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #777; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <h1>Pink Operator</h1>
  ドラッグで回転、ホイールでズーム。<br>
  <button id="btnChar" class="on">キャラクター</button><button id="btnSword" class="on">剣</button><button id="btnSpin" class="on">自動回転</button><br>
  <a href="pink-operator.glb" download>pink-operator.glb</a> / <a href="pink-operator-sword.glb" download>sword.glb</a>
</div>
<div id="status">loading…</div>
<script type="importmap">
{ "imports": { "three": "../lib/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '../lib/three/OrbitControls.js';
import { GLTFLoader } from '../lib/three/GLTFLoader.js';

const app = document.getElementById('app');
const status = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f2f4);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
camera.position.set(1.8, 1.6, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 0.9, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd9c8d2, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-2, 4, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9ec, 1.0);
rim.position.set(2, 3, -3); scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(2.5, 64), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const group = new THREE.Group(); scene.add(group);
const loader = new GLTFLoader();
const parts = {};
function load(name, file, transform) {
  return new Promise((res, rej) => loader.load(file, g => {
    g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    transform?.(g.scene);
    parts[name] = g.scene; group.add(g.scene); res();
  }, undefined, rej));
}
Promise.all([
  load('char', 'pink-operator.glb'),
  load('sword', 'pink-operator-sword.glb', s => { s.position.set(0.85, 0, 0); }),
]).then(() => status.textContent = 'ready').catch(e => status.textContent = 'load error: ' + e.message);

const toggles = { btnChar: 'char', btnSword: 'sword' };
for (const [id, key] of Object.entries(toggles)) {
  document.getElementById(id).addEventListener('click', e => {
    const p = parts[key]; if (!p) return;
    p.visible = !p.visible; e.target.classList.toggle('on', p.visible);
  });
}
let spin = true;
document.getElementById('btnSpin').addEventListener('click', e => { spin = !spin; e.target.classList.toggle('on', spin); });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { if (spin) group.rotation.y += 0.004; controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
